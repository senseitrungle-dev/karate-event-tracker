<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191f"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body>
<title>Karate Event Tracker</title>
<meta name="description" content="Karate tournament and camp manager: divisions, brackets, WTKF scoring, rings, results.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: app bar + scrollable tab strip + single content column (max 1200px); modal sheets slide up on phones. */
:root {
  --paper: #f2f3ee;      /* tatami-grey ground */
  --panel: #ffffff;
  --ink: #17191f;
  --ink-2: #4d525c;
  --ink-3: #7b808a;
  --line: #d9dbd3;
  --line-2: #c6c9bf;
  --ai: #213f73;         /* aizome indigo accent */
  --ai-soft: #e3e9f4;
  --aka: #c21a2c;        /* Aka corner */
  --aka-soft: #fbe4e6;
  --aka-bg: #c21a2c;     /* Aka corner fill, white text */
  --go: #0b7a5c;         /* actionable: score / tap to act */
  --go-soft: #dcf2ea;
  --go-ink: #ffffff;
  --shiro: #ffffff;      /* Shiro corner */
  --shiro-ink: #17191f;
  --gold: #b88a13; --silver: #7d8591; --bronze: #9b5a2a;
  --ok: #2c7a4b; --ok-soft: #e0f1e6;
  --warn: #9a6a00; --warn-soft: #fbf0d4;
  --bad: #b3261e; --bad-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(20,24,35,.06), 0 8px 24px rgba(20,24,35,.08);
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* plain (undotted) zero for scores */
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121419; --panel: #1b1e25; --ink: #eceef2; --ink-2: #b4b9c4; --ink-3: #868c98;
  --line: #2c3039; --line-2: #3a3f4a; --ai: #8fb0ea; --ai-soft: #1f2a3f;
  --aka: #ff5a67; --aka-soft: #3a1a1e; --aka-bg: #a51c2b; --go: #3ccf9a; --go-soft: #123a2e; --go-ink: #06241a; --shiro: #eef0f4; --shiro-ink: #121419;
  --gold: #e0b43c; --silver: #aab2bf; --bronze: #d08a55;
  --ok: #6fcf97; --ok-soft: #173024; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8a80; --bad-soft: #3a1b19;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121419; --panel: #1b1e25; --ink: #eceef2; --ink-2: #b4b9c4; --ink-3: #868c98;
  --line: #2c3039; --line-2: #3a3f4a; --ai: #8fb0ea; --ai-soft: #1f2a3f;
  --aka: #ff5a67; --aka-soft: #3a1a1e; --aka-bg: #a51c2b; --go: #3ccf9a; --go-soft: #123a2e; --go-ink: #06241a; --shiro: #eef0f4; --shiro-ink: #121419;
  --gold: #e0b43c; --silver: #aab2bf; --bronze: #d08a55;
  --ok: #6fcf97; --ok-soft: #173024; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8a80; --bad-soft: #3a1b19;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 1.55rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; }
p { margin: 0; }
a { color: var(--ai); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-size: .82rem; } .tiny { font-size: .74rem; }
.label { font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* app bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: #fff; }
:root[data-theme="dark"] .bar { background: #0b0c10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar { background: #0b0c10; } }
.bar-in { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; color: inherit; padding: 0; font: inherit; }
.brand .mark { width: 30px; height: 30px; border-radius: 50%; background: #fff; position: relative; flex: none; }
.brand .mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #c21a2c; }
.brand > span { text-align: left; }
.brand b { font-family: var(--f-display); font-size: 1.02rem; letter-spacing: .02em; }
.brand small { display: block; font-size: .7rem; opacity: .65; letter-spacing: .08em; text-transform: uppercase; }
.bar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--ai-soft); color: var(--ai); white-space: nowrap; }
.bar .chip { background: rgba(255,255,255,.12); color: #fff; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.aka { background: var(--aka-soft); color: var(--aka); }
.chip.plain { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.bar select { width: auto; max-width: 220px; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.bar select option { color: #000; }

/* tabs */
.tabs { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 52px)); z-index: 15; }
.tabs-in { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 12px 10px; font: 600 .88rem var(--f-body); color: var(--ink-2); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--aka); }
.tab:focus-visible { outline: 2px solid var(--ai); outline-offset: -2px; }

main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 14px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.section-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font: 600 1.6rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--ai); }

/* buttons & inputs */
button, .btn { font: 600 .86rem var(--f-body); border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); padding: 8px 13px; cursor: pointer; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
button:hover { border-color: var(--ink-3); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ai); outline-offset: 1px; }
button.primary { background: var(--ai); border-color: var(--ai); color: #fff; }
:root[data-theme="dark"] button.primary { color: #0e1422; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0e1422; } }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
button.ghost { border-color: transparent; background: transparent; }
button.sm { min-height: 30px; padding: 4px 9px; font-size: .8rem; }
button:disabled { opacity: .45; cursor: not-allowed; }
label.f { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--ink-2); min-width: 0; }
label.f.req > span::after { content: " *"; color: var(--aka); }
input, select, textarea { font: .92rem var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; accent-color: var(--ai); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: .88rem; cursor: pointer; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.fgrid .span { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin: 0; min-width: 0; }
legend { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 0 6px; }
.search { max-width: 280px; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--ai-soft); }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* empty */
.empty { text-align: center; padding: 36px 16px; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty .mark-lg { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--line-2); position: relative; }
.empty .mark-lg::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: var(--aka); opacity: .8; }
.notice { border-radius: var(--r); padding: 10px 14px; font-size: .88rem; display: flex; gap: 10px; align-items: flex-start; }
.notice.warn { background: var(--warn-soft); color: var(--warn); } .notice.info { background: var(--ai-soft); color: var(--ai); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }

/* event cards */
.ev-card { text-align: left; display: grid; gap: 8px; align-content: start; cursor: pointer; width: 100%; font-weight: 400; justify-content: stretch; }
.ev-card:hover { border-color: var(--ai); }
.ev-card .date { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-2); }

/* aka / shiro */
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.belt { width: 5px; height: 22px; border-radius: 2px; flex: none; border: 1px solid var(--line-2); }
.belt.a { background: var(--aka); border-color: var(--aka); } .belt.b { background: var(--shiro); border-color: var(--ink-3); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dojo { font-size: .76rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* brackets */
.bracket-wrap { overflow-x: auto; padding-bottom: 6px; }
.bracket { display: flex; gap: 22px; min-width: min-content; align-items: stretch; padding: 4px 2px; }
.bcol { display: flex; flex-direction: column; gap: 8px; min-width: 210px; width: 210px; }
.bcol-in { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
.bcol > .label { text-align: center; margin-bottom: 2px; }
.bm { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; cursor: default; position: relative; font-size: .84rem; }
.bm.click { cursor: pointer; } .bm.click:hover { border-color: var(--ai); box-shadow: var(--shadow); }
.bm.ready { border-color: var(--ai); } .bm.live { border-color: var(--aka); box-shadow: 0 0 0 2px var(--aka-soft); }
.bm .ln { display: grid; grid-template-columns: 6px 1fr auto; gap: 8px; align-items: center; padding: 6px 9px 6px 0; min-height: 32px; }
.bm .ln + .ln { border-top: 1px solid var(--line); }
.bm .ln .strip { align-self: stretch; }
.bm .ln.a .strip { background: var(--aka); } .bm .ln.b .strip { background: var(--line-2); }
.bm .ln.win .name { color: var(--ink); } .bm .ln.lose .name { color: var(--ink-3); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--line-2); }
.bm .ln .sc { font: 600 .8rem var(--f-mono); color: var(--ink-2); }
.bm .ln.tbd .name { color: var(--ink-3); font-weight: 500; font-style: italic; }
.bm .meta { font-size: .68rem; color: var(--ink-3); padding: 3px 9px; background: var(--paper); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; }
.stage-h { margin: 6px 0 8px; }

/* medals */
.medal { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 .72rem var(--f-mono); color: #fff; flex: none; }
.medal.g { background: var(--gold); } .medal.s { background: var(--silver); } .medal.b { background: var(--bronze); }
.podium { display: grid; gap: 6px; }
.podium .pl { display: flex; gap: 10px; align-items: center; min-width: 0; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(12,14,20,.5); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--panel); border-radius: 14px; width: min(760px, 100%); max-height: calc(100% - 20px); overflow: auto; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr auto; }
.sheet.wide { width: min(1000px, 100%); }
.sheet-h { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sheet-b { padding: 16px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.sheet-f { position: sticky; bottom: 0; background: var(--panel); padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 640px) { .scrim { padding: 0; place-items: end stretch; } .sheet { border-radius: 14px 14px 0 0; max-height: 94%; width: 100%; } }
#confirm .sheet { width: min(420px, 100%); }

/* scoreboard */
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 230px) minmax(0, 1fr); gap: 10px; align-items: stretch; }
@media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .corner { padding: 8px; } .corner button { padding: 6px 4px; font-size: .74rem; } .corner .big { font-size: 2.4rem; } .board .mid { grid-column: 1 / -1; order: -1; } }
.corner { border-radius: 12px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.corner.a { background: var(--aka-bg); color: #fff; }
.corner.b { background: var(--shiro); color: var(--shiro-ink); border: 2px solid var(--line-2); }
.corner .who { font-weight: 700; font-family: var(--f-display); font-size: 1.02rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.corner .big { font: 700 3.2rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.corner .tally { font: 600 .78rem var(--f-mono); opacity: .85; }
.corner .btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.corner button { min-width: 0; overflow-wrap: anywhere; }
.corner button { min-height: 42px; font-size: .82rem; background: rgba(255,255,255,.14); color: inherit; border-color: rgba(255,255,255,.4); }
.corner.b button { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.22); color: var(--shiro-ink); }
.corner button.pen { font-weight: 500; }
.mid { display: grid; gap: 8px; align-content: start; justify-items: stretch; min-width: 150px; }
.clock { font: 700 2.3rem/1 var(--f-mono); font-variant-numeric: tabular-nums; text-align: center; padding: 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); }
.clock.zero { color: var(--aka); }
.phase { text-align: center; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ai); }
.log { font: .74rem var(--f-mono); color: var(--ink-3); max-height: 90px; overflow: auto; }
.judges { display: grid; gap: 8px; }
.jrow { display: grid; grid-template-columns: 48px 1fr 1fr; gap: 6px; align-items: center; }
.jrow button.on.a { background: var(--aka-bg); color: #fff; border-color: var(--aka-bg); }
.jrow button.on.b { background: var(--shiro); color: var(--shiro-ink); border: 2px solid var(--ink); }
.srow { display: grid; grid-template-columns: 90px repeat(var(--j, 5), minmax(52px, 1fr)) 80px; gap: 6px; align-items: center; }
.srow input { text-align: center; font-family: var(--f-mono); padding: 6px 2px; }
.srow .tot { font: 700 1.05rem var(--f-mono); text-align: right; }
.result-banner { border-radius: 10px; padding: 12px 14px; background: var(--ok-soft); color: var(--ok); font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bout { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 10px; }
.bout-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ring board */
.ring-card .now { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.ring-card .now .sc { font: 700 1.6rem var(--f-mono); padding: 0 6px; }
.queue { display: grid; gap: 4px; }
.queue .q { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; font-size: .84rem; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.queue .q .vs { font-size: .7rem; color: var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: .88rem; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
.pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px 3px 3px; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; }
.person img { width: 22px; height: 22px; border-radius: 50%; }
.dd { position: relative; }
.dd-list { position: absolute; left: 0; right: 0; top: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); z-index: 5; max-height: 240px; overflow: auto; }
.dd-list button { width: 100%; justify-content: flex-start; border: 0; border-radius: 0; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(12px); opacity: .6; } } }

/* kata score pools */
table.kp tr.adv td { background: color-mix(in srgb, var(--ok-soft) 55%, transparent); }
.jcell { white-space: nowrap; }
.js { display: inline-block; min-width: 2.6em; text-align: center; font: 500 .8rem var(--f-mono); color: var(--ink-2); }
.js.dropped { color: var(--ink-3); text-decoration: line-through; }
.kprow { display: grid; grid-template-columns: repeat(var(--j, 6), minmax(56px, 1fr)); gap: 6px; }
.kprow input { text-align: center; font-family: var(--f-mono); }
.kp-total { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.kp-total b { font: 700 2rem var(--f-mono); }

/* recorded result detail */
details.rec { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
details.rec summary { cursor: pointer; font-weight: 700; }
.rec-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rec-flag { font-size: .78rem; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2); }

  if (!DC.comps.length) return eventHeader() + `<div class="card empty"><div class="mark-lg"></div><h2>No ${word}s registered</h2><p class="muted">${dir ? `Add ${word}s one at a time or import a spreadsheet (CSV).` : 'Registrations will appear here.'}</p>${dir ? `<div class="row">${acts}</div>` : ''}</div>`;
  const rows = list.map(c => {
    const age = KT.ageOf(c, DC.asOf), miss = dir ? KT.validateCompetitor(c, DC.asOf) : [];
    const evs = tour ? (c.events || []).map(et => {
      const T = KT.EVENT_TYPES[et]; if (!T) return '';
      if (T.team) { const tm = DC.teams.find(t => t.eventType === et && (t.memberIds || []).includes(c.id)); return `<span class="chip plain" title="${esc(tm ? tm.name : 'Not on a team yet')}">${esc(T.short)}${tm ? '' : ' ?'}</span>`; }
      const did = (placedIn[c.id] || []).find(d => DC.divBy[d] && DC.divBy[d].eventType === et);
      return `<span class="chip ${did ? 'plain' : 'bad'}" title="${esc(did ? DC.divBy[did].name : 'No matching division')}">${esc(T.short)}</span>`;
    }).join(' ') : '';
    return `<tr class="${dir ? 'click' : ''}" ${dir ? `data-act="comp-edit" data-id="${esc(c.id)}"` : ''}>
      <td><div class="name">${esc(c.lastName)}, ${esc(c.firstName)}</div><div class="dojo">${esc(c.dojo || '')}${c.state || c.country ? ' · ' + esc([c.state, c.country].filter(Boolean).join(', ')) : ''}</div></td>
      <td>${esc(c.gender === 'F' ? 'W' : c.gender === 'M' ? 'M' : '')}${age != null ? ` · <span class="num">${age}</span>` : ''}</td>
      <td>${esc(KT.rankLabel(c.rank))}</td>
      ${tour ? `<td><div class="pill-list">${evs}</div></td>` : ''}
      <td>${c.status === 'withdrawn' ? '<span class="chip bad">Withdrawn</span>' : dir ? `<button class="sm ${c.checkedIn ? '' : 'ghost'}" data-act="checkin" data-id="${esc(c.id)}" aria-pressed="${!!c.checkedIn}">${c.checkedIn ? '✓ Checked in' : 'Check in'}</button>` : (c.checkedIn ? '<span class="chip ok">Checked in</span>' : '<span class="chip plain">Not checked in</span>')}
        ${miss.length ? `<span class="chip warn" title="Missing: ${esc(miss.join(', '))}">Incomplete</span>` : ''}</td></tr>`;
  }).join('');
  return fab('comp-new', tour ? 'Add competitor' : 'Add participant') + eventHeader() + `<div class="section-h">${tools}<div class="row actions">${acts}</div></div>
    <div class="card flush"><div class="tw"><table class="mcards"><thead><tr><th>Name</th><th>Sex · Age</th><th>Rank</th>${tour ? '<th>Events</th>' : ''}<th>Status</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="muted">No ${word}s match this filter.</td></tr>`}</tbody></table></div></div>
    <p class="small muted">${plural(list.length, word)} shown · ages as of ${fmtDate(DC.asOf)}.${dir ? ' Contact details, dates of birth and emergency contacts are visible to directors only.' : ''}</p>`;
}

/* ---------- teams ---------- */
function teamsHTML() {
  const ev = curEvent();
  const types = (ev.eventTypes || KT.EVENT_ORDER).filter(t => KT.EVENT_TYPES[t].team);
  const unplaced = new Set(DC.assign.unplaced.filter(u => u.kind === 'team').map(u => u.id));
  const placed = {}; for (const did in DC.assign.byDiv) for (const id of DC.assign.byDiv[did]) placed[id] = did;
  const secs = types.map(et => {
    const T = KT.EVENT_TYPES[et], list = DC.teams.filter(t => t.eventType === et).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    const need = DC.comps.filter(c => (c.events || []).includes(et) && c.status !== 'withdrawn' && !DC.teams.some(t => t.eventType === et && (t.memberIds || []).includes(c.id)));
    return `<div class="card flush"><div class="card-h"><div><h3>${esc(T.label)}</h3><div class="small muted">${T.size[0] === T.size[1] ? T.size[0] : T.size[0] + '–' + T.size[1]} members · ${T.genders.map(g => KT.GENDERS[g]).join(' / ')}</div></div>
      <button class="sm" data-act="team-new" data-et="${et}">New team</button></div>
      ${need.length ? `<div class="notice info" style="margin:10px 16px 0">${plural(need.length, 'competitor')} entered ${esc(T.short)} without a team: ${need.slice(0, 6).map(c => esc(c.firstName + ' ' + c.lastName)).join(', ')}${need.length > 6 ? '…' : ''}</div>` : ''}
      <div class="tw"><table><tbody>${list.map(t => {
        const mem = (t.memberIds || []).map(id => DC.compBy[id]).filter(Boolean);
        return `<tr class="click" data-act="team-edit" data-id="${esc(t.id)}"><td><div class="name">${esc(t.name)}</div><div class="dojo">${esc(t.dojo || '')}</div></td>
        <td class="small">${mem.map(m => esc(m.firstName + ' ' + m.lastName)).join(', ') || '<span class="muted">No members</span>'}</td>

      }).join('') || `<tr><td class="muted">No teams yet.</td></tr>`}</tbody></table></div></div>`;
  }).join('');
  return eventHeader() + (types.length ? `<div class="stack">${secs}</div>` : `<div class="card empty"><p>This tournament offers no team events. Turn them on in Event settings.</p></div>`);
}

/* ---------- divisions ---------- */
function divisionsHTML() {
  const ev = curEvent();
  const f = S.ui.divFilter;
  const list = DC.divs.filter(d => !f || d.eventType === f);
  const acts = `<button data-act="div-std">Add black-belt divisions</button><button data-act="div-kyu">Add kyu divisions</button><button data-act="div-new">New division</button>

  const rows = list.map(d => {
    const n = divEntrants(d.id).length, bs = bracketState(d.id), ring = S.d.rings[d.ringId];
    const st = !bs.drawn ? (n >= 2 ? '<span class="chip plain">Ready to draw</span>' : n === 1 ? '<span class="chip warn">1 entrant</span>' : '<span class="chip plain">Empty</span>')
      : bs.complete ? '<span class="chip ok">Finished</span>' : `<span class="chip">${bs.fought}/${bs.playable} ${bs.kp ? 'performances' : 'matches'}</span>${bs.changed ? ' <span class="chip warn">Entrants changed</span>' : ''}`;
    return `<tr><td><button class="ghost sm" style="padding:0;min-height:0;text-align:left;justify-content:flex-start" data-act="div-panel" data-id="${esc(d.id)}"><span class="name">${esc(d.name)}</span></button>
        <div class="dojo">${d.belt === 'kyu' ? esc(KT.rankLabel(d.minRank) + ' – ' + KT.rankLabel(d.maxRank)) + ' · ' : ''}${ageRange(d)}</div></td>
      <td class="small">${esc(KT.FORMATS[d.format] || d.format)}<div class="dojo">${esc(scoringLabel(d))}</div></td>
      <td class="small">${ring ? esc(ring.name) : '<span class="muted">—</span>'}</td>
      <td class="n">${n}</td><td>${st}</td>
      <td style="white-space:nowrap">${bs.drawn ? `<button class="sm" data-act="view-bracket" data-id="${esc(d.id)}">Bracket</button>` : n >= 1 ? `<button class="sm" data-act="draw" data-id="${esc(d.id)}">Draw</button>` : ''}</td></tr>`;
  }).join('');
  return eventHeader() + `<div class="section-h"><select id="div-f" data-change="divFilter" aria-label="Event filter" style="max-width:240px">${opt('', 'All events', f)}${(ev.eventTypes || KT.EVENT_ORDER).map(t => opt(t, KT.EVENT_TYPES[t].label, f)).join('')}</select><div class="row actions">${acts}</div></div>
    <div class="card flush"><div class="tw"><table class="mcards"><thead><tr><th>Division</th><th>Format</th><th>Ring</th><th class="n">Entrants</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function ageRange(d) {
  const lo = d.minAge === '' || d.minAge == null ? null : d.minAge, hi = d.maxAge === '' || d.maxAge == null ? null : d.maxAge;
  if (lo == null && hi == null) return 'All ages';
  if (hi == null) return `Age ${lo}+`;
  if (lo == null) return `Age ≤${hi}`;
  return lo === hi ? `Age ${lo}` : `Age ${lo}–${hi}`;
}

/* ---------- rings ---------- */
function ringsHTML() {
  const cards = DC.rings.map(r => {
    const divs = DC.divs.filter(d => d.ringId === r.id && divEntrants(d.id).length).sort((a, b) => (a.ringOrder || 0) - (b.ringOrder || 0));

      <div><div class="label">Managers</div><div class="pill-list" style="margin-top:6px">${(r.managerIds || []).map(id => `${personChip(id)}<button class="sm ghost" data-act="ring-unmanage" data-id="${esc(r.id)}" data-uid="${esc(id)}" aria-label="Remove manager">✕</button>`).join('') || '<span class="small muted">No manager assigned — only directors can score this ring.</span>'}</div>

        <div class="dd" style="margin-top:8px"><input id="mgr-q-${esc(r.id)}" type="search" placeholder="Search your organization by name or email…" data-input="mgr-search" data-ring="${esc(r.id)}" autocomplete="off"><div class="dd-list" id="mgr-dd-${esc(r.id)}" hidden></div></div>
        <p class="tiny muted" style="margin-top:4px">Not listed? Invite them by email on the <a href="#" data-act="tab" data-v="people">People</a> tab.</p>`}</div>
      <div><div class="row between"><div class="label">Judges</div><span class="tiny muted">${plural(ringJudges(r.id).length, 'judge')}</span></div><div class="pill-list" style="margin-top:6px">${ringJudgesSummary(r.id)}</div>
        ${Object.keys(S.d.judges).length ? `<select id="ring-addj-${esc(r.id)}" data-change="ring-addjudge" data-ring="${esc(r.id)}" style="margin-top:8px" aria-label="Add a judge to ${esc(r.name)}">${opt('', 'Add a judge to this ring…', '')}${judgesList().filter(j => j.ringId !== r.id).sort((a, b) => (S.d.rings[a.ringId] ? 1 : 0) - (S.d.rings[b.ringId] ? 1 : 0)).map(j => opt(j.id, j.name + (S.d.rings[j.ringId] ? ` (from ${ringName(j.ringId)})` : ' (unassigned)'), '')).join('')}</select>` : '<p class="tiny muted" style="margin-top:6px">Add judges on the Judges tab.</p>'}</div>
      ${ringReadyHTML(r)}
      <div><div class="row between"><div class="label">Divisions, in running order</div>${divs.length > 1 ? '<span class="tiny muted">Touch and hold a division to drag it</span>' : ''}</div>
      <div class="rdivs" data-ring="${esc(r.id)}">${divs.map((d, i) => `<div class="rdiv" data-id="${esc(d.id)}" data-tap="div-panel" tabindex="0" aria-label="${esc(d.name)}, position ${i + 1}. Hold to move; Alt+arrow keys also move.">
        <span class="grip" aria-hidden="true">⋮⋮</span><span class="rnum num">${i + 1}</span>
        <span class="rname"><span class="name">${esc(d.name)}</span><span class="dojo">${plural(divEntrants(d.id).length, 'entrant')}${bracketState(d.id).drawn ? ' · drawn' : ''}${awaySegs(d).map(([sg, rr]) => ` · ${esc(SEG_LABEL(sg))} → ${esc(ringName(rr))}`).join('')}</span></span>
        <select class="rmove" id="rmv-${esc(d.id)}" data-change="div-ring" data-id="${esc(d.id)}" aria-label="Move ${esc(d.name)} to ring">${opt('', 'Move…', '')}${others.map(x => opt(x.id, 'To ' + x.name, '')).join('')}${opt('__none', 'Remove from ring', '')}</select></div>`).join('') || '<span class="small muted">No divisions with competitors assigned.</span>'}</div>
      ${guest.length ? `<div class="label" style="margin-top:12px">Pools &amp; rounds from other rings' divisions</div><div class="rdivs">${guest.map(g => { const gd = DC.divBy[g.did]; return `<div class="rdiv guest"><span class="rnum num">↪</span><span class="rname"><span class="name">${esc(gd.name)} · ${esc(SEG_LABEL(g.seg))}</span><span class="dojo">From ${esc(ringName(gd.ringId))}</span></span>
        <select class="rmove" id="gmv-${esc(g.did)}-${esc(g.seg.replace(':', ''))}" data-change="seg-ring" data-did="${esc(g.did)}" data-seg="${esc(g.seg)}" aria-label="Move">${opt('', 'Move…', '')}${DC.rings.filter(x => x.id !== r.id).map(x => opt(x.id, 'To ' + x.name + (x.id === gd.ringId ? ' (back)' : ''), '')).join('')}</select></div>`; }).join('')}</div>` : ''}
      <div class="row" style="margin-top:8px"><button class="sm" data-act="ring-live" data-id="${esc(r.id)}">● Live view</button><span class="tiny muted">Tap a division to place its pools, rounds and judges.</span></div>

    `<div class="card empty"><div class="mark-lg"></div><h2>No rings yet</h2><p class="muted">Add a ring (court) for each competition area, then assign a manager and the divisions it will run.</p><button class="primary" data-act="ring-new">Add ring</button></div>`);
}

/* ---------- mat / ring board ---------- */
function ringQueue(rid) {
  const out = [];
  // native divisions in running order, then pools/rounds/matches of other divisions placed on this ring
  const divs = DC.divs.filter(d => S.d.brackets[d.id]).sort((a, b) => ((a.ringId === rid ? 0 : 1) - (b.ringId === rid ? 0 : 1)) || (a.ringOrder || 0) - (b.ringOrder || 0));
  for (const d of divs) {
    const br = S.d.brackets[d.id];
    if (br.format === 'KP') { for (const p of KT.kpQueue(br)) if (KT.ringOf(d, p.seg) === rid) out.push({ did: d.id, kp: p }); continue; }
    for (const m of KT.readyMatches(br, DC.res[d.id])) if (KT.ringOf(d, KT.segOf(br, m), m.id) === rid) out.push({ did: d.id, m, r: DC.res[d.id][m.id] });
  }
  return out;
}
function nowHTML(rs) {
  if (!rs || !rs.did || !S.d.brackets[rs.did]) return '';
  const dv = DC.divBy[rs.did], br = S.d.brackets[rs.did];
  if (rs.kp) {
    const q = br.format === 'KP' ? KT.kpQueue(br).find(x => x.key === rs.kp) : null;
    if (!q) return '';
    return `<div class="label">${esc(dv ? dv.name : '')} · ${esc(q.label)}</div>
      <div class="now" style="grid-template-columns:1fr auto"><div class="side"><span class="belt a" style="background:var(--ai);border-color:var(--ai)"></span><span style="min-width:0"><div class="name">${esc(entName(q.id))}</div><div class="dojo">${esc(entDojo(q.id))}${rs.kata ? ' · ' + esc(rs.kata) : ''}</div></span></div>
      <div class="sc num">${rs.score != null && rs.score !== '' ? esc(rs.score) : ''}</div></div>`;
  }
  const res = (DC.res[rs.did] || {})[rs.mid];
  if (!res || res.status !== 'ready') return '';
  return `<div class="label">${esc(dv ? dv.name : '')} · ${esc(KT.matchLabel(br.matches[rs.mid], br))}</div>
    <div class="now" data-act="match" data-did="${esc(rs.did)}" data-mid="${esc(rs.mid)}" role="button" tabindex="0" style="cursor:pointer"><div class="side"><span class="belt a"></span><span style="min-width:0"><div class="name">${esc(entName(res.a))}</div><div class="dojo">${esc(entDojo(res.a))}</div></span></div>
    <div class="sc num">${rs.score ? `${esc(rs.score.a)}–${esc(rs.score.b)}` : 'vs'}</div>
    <div class="side" style="justify-content:flex-end;text-align:right"><span style="min-width:0"><div class="name">${esc(entName(res.b))}</div><div class="dojo">${esc(entDojo(res.b))}</div></span><span class="belt b"></span></div></div>
    ${rs.phase ? `<div class="phase">${esc(rs.phase)}</div>` : ''}`;
}
function ringBoardHTML(rings, withActions) {
  if (!rings.length) return `<div class="card small muted">No rings set up yet.</div>`;
  return `<div class="grid2">${rings.map(r => {
    const rs = S.d.ringstate[r.id], q = ringQueue(r.id);
    const now = nowHTML(rs);
    const isNow = x => rs && x.did === rs.did && (x.kp ? rs.kp === x.kp.key : x.m.id === rs.mid);
    const next = q.filter(x => !isNow(x)).slice(0, withActions ? 12 : 3);
    const openBtn = withActions && now && (rs.kp ? canScoreKP(rs.did, rs.kp) : canScoreMatch(rs.did, rs.mid)) ? `<div class="row" style="margin-top:8px"><button class="go" ${rs.kp ? `data-act="kp-score" data-did="${esc(rs.did)}" data-key="${esc(rs.kp)}"` : `data-act="score" data-did="${esc(rs.did)}" data-mid="${esc(rs.mid)}"`}>Open scoresheet</button></div>` : '';
    return `<div class="card ring-card stack"><div class="row between"><h3>${esc(r.name)}</h3><span class="chip ${q.length ? '' : 'plain'}">${q.length} waiting</span></div>
      <div>${now || '<div class="small muted">Nothing on the mat.</div>'}${openBtn}</div>
      <div class="queue"><div class="label">Up next</div>${next.map(x => {
        const can = withActions && (x.kp ? canScoreKP(x.did, x.kp.key) : canScoreMatch(x.did, x.m.id));
        if (x.kp) return `<div class="q" style="grid-template-columns:1fr auto"><span class="side"><span class="belt a" style="background:var(--ai);border-color:var(--ai)"></span><span class="name">${esc(entName(x.kp.id))}</span></span>
          <span class="vs">${can ? `<button class="sm go" data-act="kp-score" data-did="${esc(x.did)}" data-key="${esc(x.kp.key)}">Score</button>` : 'kata'}</span></div>
          <div class="tiny muted" style="margin-top:-4px">${esc(DC.divBy[x.did].name)} · ${esc(x.kp.label)}</div>`;
        return `<div class="q" data-act="match" data-did="${esc(x.did)}" data-mid="${esc(x.m.id)}" role="button" tabindex="0"><span class="side"><span class="belt a"></span><span class="name">${esc(entName(x.r.a))}</span></span>
        <span class="vs">${can ? `<button class="sm go" data-act="score" data-did="${esc(x.did)}" data-mid="${esc(x.m.id)}">Score</button>` : 'vs'}</span>
        <span class="side" style="justify-content:flex-end"><span class="name">${esc(entName(x.r.b))}</span><span class="belt b"></span></span></div>
        <div class="tiny muted" style="margin-top:-4px">${esc(DC.divBy[x.did].name)} · ${esc(KT.matchLabel(x.m, S.d.brackets[x.did]))}${kindOf(DC.divBy[x.did]) === 'fukugo' ? ' · ' + (KT.fukugoPart(x.m, S.d.brackets[x.did]) === 'kitei' ? 'Ki-tei' : 'Kumite') : ''}</div>`;
      }).join('') || '<div class="small muted">Nothing waiting.</div>'}</div></div>`;
  }).join('')}</div>`;
}
function matHTML() {
  const mine = myRingIds();
  const r = role();
  let rings = DC.rings;
  const sel = S.ui.ring;
  if (sel) rings = rings.filter(x => x.id === sel);
  const note = r === 'manager' ? `<div class="notice info">You manage ${mine.length ? mine.map(id => esc((S.d.rings[id] || {}).name || '')).join(', ') : 'no ring yet'}. You can score matches for divisions assigned to your ring${mine.length === 1 ? '' : 's'}.</div>`
    : r === 'viewer' ? `<div class="notice info">Live view. Scores update as ring managers record them.</div>` : '';
  return eventHeader(`<select id="mat-ring" data-change="ring" aria-label="Ring" style="max-width:200px">${opt('', 'All rings', sel)}${DC.rings.map(x => opt(x.id, x.name + (mine.includes(x.id) && r === 'manager' ? ' (yours)' : ''), sel)).join('')}</select>`)
    + note + (role() !== 'viewer' && !(curEvent() || {}).live ? `<div class="grid2" style="margin-bottom:14px">${rings.map(ringReadyHTML).filter(Boolean).map(h => `<div class="card">${h}</div>`).join('')}</div>` : '') + ringBoardHTML(rings, true);
}

/* ---------- brackets ---------- */
function bracketsHTML() {
  const drawn = DC.divs.filter(d => S.d.brackets[d.id]);
  if (!S.ui.bracketDiv || !DC.divBy[S.ui.bracketDiv]) S.ui.bracketDiv = drawn.length ? drawn[0].id : '';

function podiumHTML(did) {

function bracketViewHTML(did) {
  const br = S.d.brackets[did], res = DC.res[did] || {};

  const ms = Object.values(br.matches || {});
  if (!ms.length) return `<div class="card small muted">Only one entrant — awarded automatically.</div>`;
  const live = Object.values(S.d.ringstate).find(x => x.did === did);
  const liveId = live ? live.mid : null;
  const cols = (stage, title, pool) => {
    const list = ms.filter(m => m.stage === stage && (pool === undefined || m.pool === pool));
    if (!list.length) return '';
    const rounds = [...new Set(list.map(m => m.round))].sort((a, b) => a - b);
    return `<div class="stage-h label">${title}</div><div class="bracket-wrap"><div class="bracket">${rounds.map(rd => {
      const rm = list.filter(m => m.round === rd).sort((a, b) => a.idx - b.idx);
      return `<div class="bcol"><div class="label">${esc(stage === 'L' ? (KT.matchLabel(rm[0], br).includes('3rd/4th') ? 'Final (3rd/4th)' : 'Round ' + rd) : KT.matchLabel(rm[0], br).replace(/^Pool \w+ · /, ''))}</div><div class="bcol-in">${rm.map(m => bmHTML(did, m, res, m.id === liveId)).join('')}</div></div>`;
    }).join('')}</div></div>`;
  };
  const one = id => `<div class="bcol">${bmHTML(did, br.matches[id], res, liveId === id)}</div>`;
  const elim = (pool, X) => {
    const de = br.format === 'DE' || br.format === 'DES';
    let h = cols('W', de ? (br.format === 'DES' ? 'Winners bracket · final decides 1st & 2nd' : 'Winners bracket') : 'Bracket', pool);
    if (br.matches[X + 'B']) h += `<div class="stage-h label">Bronze match</div>${one(X + 'B')}`;
    if (de && ms.some(m => m.stage === 'L' && m.pool === pool)) h += cols('L', br.format === 'DES' ? 'Repechage bracket · final decides 3rd & 4th' : 'Repechage (losers) bracket', pool);
    for (const id of [X + 'GF', X + 'GF2']) if (br.matches[id]) h += `<div class="stage-h label">${id.endsWith('GF2') ? 'Grand final reset' : 'Grand final'}</div>${one(id)}`;
    return h;
  };
  let html = '';
  const playoff = () => ms.some(m => m.stage === 'PO') ? `<div class="card"><div class="row between"><div class="small muted">Top 2 of each pool advance.</div>${roundsRingLine(did)}</div>${cols('PO', 'Playoff')}${br.matches['PO-B'] ? `<div class="stage-h label">Bronze match</div>${one('PO-B')}` : ''}</div>` : '';
  if (br.format === 'RR') {
    html += `<div class="grid2">${Object.keys(br.pools || {}).map(P => poolHTML(did, P, liveId)).join('')}</div>` + playoff();
  } else if (br.elimPools) {
    for (const P of Object.keys(br.pools)) {
      html += `<div class="card"><div class="row between"><h3>Pool ${esc(P)}</h3>${segRingChip(did, 'P:' + P)}</div><div class="small muted">${plural(br.pools[P].length, 'entrant')}</div>${elim(P, `E${P}-`) || '<p class="small muted">Single entrant — advances automatically.</p>'}</div>`;
    }
    html += playoff();
  } else {
    html += `<div class="card">${roundsRingLine(did) ? `<div class="row" style="justify-content:flex-end">${roundsRingLine(did)}</div>` : ''}${elim(undefined, '')}</div>`;
  }
  return html;
}
/** Ring a pool / round runs on (shown to everyone in the bracket view). */
/** Ring a pool / round runs on. Director: a selector to move it to another ring (pools run in parallel); everyone else: a label. */
function segRingChip(did, seg, label) {

/* ---------- results ---------- */

    return `<div class="card stack"><div class="row between"><div style="min-width:0"><h3>${esc(d.name)}</h3><div class="small muted">${S.d.rings[d.ringId] ? esc(S.d.rings[d.ringId].name) : 'No ring'}</div></div>

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const EV_ALIASES = { 'individual kata': 'IKATA', kata: 'IKATA', ikata: 'IKATA', 'individual kumite': 'IKUMITE', kumite: 'IKUMITE', ikumite: 'IKUMITE', 'team kata': 'TKATA', tkata: 'TKATA',
  'team kumite': 'TKUMITE', tkumite: 'TKUMITE', fukugo: 'FUKUGO', fukogo: 'FUKUGO', enbu: 'ENBU' };
function importRows(text) {
  const rows = parseCSV(text); if (rows.length < 2) return { recs: [], errors: ['Need a heading row and at least one competitor.'] };
  const h = rows[0].map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
  const col = (...names) => h.findIndex(x => names.includes(x));
  const ix = { first: col('firstname', 'first', 'givenname'), last: col('lastname', 'last', 'surname', 'familyname'), gender: col('gender', 'sex'), dob: col('dob', 'dateofbirth', 'birthdate', 'birthday'),
    rank: col('rank', 'belt', 'grade'), dojo: col('dojo', 'club', 'school'), state: col('state', 'region', 'province'), country: col('country'), email: col('email'), phone: col('phone', 'mobile'),
    en: col('emergencyname', 'emergencycontact', 'emergency'), ep: col('emergencyphone'), waiver: col('waiver', 'waiversigned'), paid: col('paid', 'feepaid'), events: col('events', 'event', 'divisions') };
  const recs = [], errors = [];
  const g = (r, i) => (i >= 0 ? (r[i] || '').trim() : '');
  const yes = s => /^(y|yes|true|1|x|✓)$/i.test(s);
  rows.slice(1).forEach((r, n) => {
    let dob = g(r, ix.dob);
    const m = dob.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) dob = `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
    const gs = g(r, ix.gender).toLowerCase();
    const rec = { firstName: g(r, ix.first), lastName: g(r, ix.last), gender: /^(m|male|man|men)$/.test(gs) ? 'M' : /^(f|female|w|woman|women)$/.test(gs) ? 'F' : '',
      dob: /^\d{4}-\d{2}-\d{2}$/.test(dob) ? dob : '', rank: parseRank(g(r, ix.rank)), dojo: g(r, ix.dojo), state: g(r, ix.state), country: g(r, ix.country), email: g(r, ix.email), phone: g(r, ix.phone),
      emergencyName: g(r, ix.en), emergencyPhone: g(r, ix.ep), waiver: yes(g(r, ix.waiver)), feePaid: yes(g(r, ix.paid)),
      events: [...new Set(g(r, ix.events).split(/[;|]/).map(s => EV_ALIASES[s.trim().toLowerCase()] || (KT.EVENT_TYPES[s.trim().toUpperCase()] ? s.trim().toUpperCase() : null)).filter(Boolean))] };
    const miss = [];
    if (!rec.firstName || !rec.lastName) miss.push('name'); if (!rec.rank) miss.push('rank');
    if (curEvent().kind === 'tournament') { if (!rec.gender) miss.push('gender'); if (!rec.dob) miss.push('date of birth'); }
    if (miss.length) errors.push(`Row ${n + 2}: missing ${miss.join(', ')}`); else recs.push(rec);
  });
  return { recs, errors };
}
async function runImport() {
  const { recs, errors } = importRows($('#imp-text').value);
  if (!recs.length) { $('#imp-preview').textContent = errors.join(' · ') || 'Nothing to import.'; return; }

  let done = 0;

      checkedIn: false, status: 'active', events: r.events, divOverride: {}, age: r.dob ? KT.ageOn(r.dob, DC.asOf) : null, createdAt: new Date().toISOString() };

    if (!ok) break;
    done++; $('#imp-preview').textContent = `Imported ${done} of ${recs.length}…`;
  }

}

const JUDGE_COLS = 'name, country, region, dojo, kata_level, kumite_level, ring, email, notes';
function parseLevel(s) {
  s = String(s || '').trim(); if (!s) return 0;
  const m = s.match(/([1-7])/); return m ? +m[1] : 0;
}
/** Parse judge rows. Returns {rows:[{rec, status, note, matchId}], errors:[]} — nothing is written. */
function judgeImportRows(text) {
  const rows = parseCSV(String(text || '').replace(/\t/g, ','));
  if (rows.length < 2) return { rows: [], errors: ['Need a heading row and at least one judge.'] };
  const h = rows[0].map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
  const col = (...names) => h.findIndex(x => names.includes(x));
  const ix = { name: col('name', 'judge', 'judgename', 'fullname'), first: col('firstname', 'first', 'givenname'), last: col('lastname', 'last', 'surname', 'familyname'),
    country: col('country', 'nation', 'nationality', 'federation'), region: col('region', 'state', 'province', 'area'), dojo: col('dojo', 'club', 'school'),
    kata: col('katalevel', 'kata', 'katacredential', 'katalicense', 'katalicence', 'katagrade'), kumite: col('kumitelevel', 'kumite', 'kumitecredential', 'kumitelicense', 'kumitelicence', 'kumitegrade'),
    level: col('level', 'credential', 'license', 'licence', 'grade', 'judgelevel'), ring: col('ring', 'court', 'mat'), email: col('email', 'mail'), notes: col('notes', 'note', 'remarks') };
  const errors = [];
  if (ix.name < 0 && (ix.first < 0 || ix.last < 0)) return { rows: [], errors: ['A “name” column (or first_name and last_name) is required.'] };
  if (ix.kata < 0 && ix.kumite < 0 && ix.level < 0) return { rows: [], errors: ['Credential columns are required: kata_level and kumite_level (or a single “level”).'] };
  const ev = curEvent(), need = KT.judgeNeed(ev.level), where = ev.level === 'International' ? 'country' : ev.level === 'National' ? 'region' : '';
  const g = (r, i) => (i >= 0 ? String(r[i] || '').trim() : '');
  const ringBy = {}; DC.rings.forEach(r => { ringBy[r.name.toLowerCase()] = r.id; ringBy[r.name.toLowerCase().replace(/^ring\s*/, '')] = r.id; });
  const key = j => [String(j.name || '').toLowerCase().replace(/\s+/g, ' '), String(j.country || j.region || j.dojo || '').toLowerCase()].join('|');
  const existing = {}; judgesList().forEach(j => { existing[key(j)] = j.id; existing[String(j.name || '').toLowerCase().replace(/\s+/g, ' ') + '|'] = existing[String(j.name || '').toLowerCase().replace(/\s+/g, ' ') + '|'] || j.id; });
  const seen = new Set(), out = [];
  rows.slice(1).forEach((r, n) => {
    const name = ix.name >= 0 ? g(r, ix.name) : `${g(r, ix.first)} ${g(r, ix.last)}`.trim();
    const both = parseLevel(g(r, ix.level));
    const rec = { name, country: g(r, ix.country), region: g(r, ix.region), dojo: g(r, ix.dojo),
      kataLevel: parseLevel(g(r, ix.kata)) || both, kumiteLevel: parseLevel(g(r, ix.kumite)) || both, notes: g(r, ix.notes), email: g(r, ix.email).toLowerCase() };
    const ringTxt = g(r, ix.ring).toLowerCase(); const ringId = ringTxt ? (ringBy[ringTxt] || ringBy[ringTxt.replace(/^ring\s*/, '')] || '') : null;
    if (ringId !== null) rec.ringId = ringId;
    const line = n + 2;
    if (!rec.name) { errors.push(`Row ${line}: missing name`); return; }
    if (!rec.kataLevel && !rec.kumiteLevel) { errors.push(`Row ${line} (${rec.name}): credential levels must be 1–7`); return; }
    const k = key(rec); if (seen.has(k)) { errors.push(`Row ${line} (${rec.name}): duplicate row`); return; } seen.add(k);
    const matchId = existing[k] || existing[String(rec.name).toLowerCase().replace(/\s+/g, ' ') + '|'] || '';
    const notes = [];
    if (rec.kataLevel < need && rec.kumiteLevel < need) notes.push(`below level ${need} for ${ev.level}`);
    else if (rec.kataLevel < need || rec.kumiteLevel < need) notes.push(`${rec.kataLevel < need ? 'kata' : 'kumite'} below level ${need}`);
    if (where && !rec[where]) notes.push(`no ${where}`);
    if (ringTxt && !ringId) notes.push(`ring “${g(r, ix.ring)}” not found`);
    out.push({ rec, line, matchId, status: matchId ? 'update' : 'new', warn: notes.join(' · ') });
  });
  return { rows: out, errors };
}

/* ===== v1.6: public spectator link per event ===== */
/* A director turns on a public link for one event. The link carries a random token (share/{token} → eventId).
   Opening it drops the visitor straight into that event's Dashboard as a spectator: no sign-in, no event list,
   no other events. Firestore rules let anyone read a shared event's data (never pv/ private details) and nothing else. */

function parsePublic() {
  let tok = '';
  try {
    const h = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
    const q = new URLSearchParams(String(location.search || ''));
    tok = h.get('watch') || q.get('watch') || '';
  } catch (e) { tok = ''; }
  tok = tok.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
  if (tok) S.pub = { token: tok, evId: '', error: '' };
}
const isPublicView = () => !!S.pub;
function newShareToken() {
  try { return Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return uid() + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); }
}
/** Address of the public page for a token, or '' where this copy of the app cannot hand out an anonymous link. */
function publicLink(token) {
  if (!token || !S.store) return '';
  if (S.store.mode === 'cloud') return ''; // claude.ai: signed-out visitors get no data, and the page address is the claude.ai one
  let base = '';
  try { base = location.origin && location.origin !== 'null' ? location.origin + location.pathname : location.href.split('#')[0].split('?')[0]; } catch (e) { base = ''; }
  return base ? `${base}#watch=${token}` : '';
}
async function startPublic() {
  watchBranding();
  let sh = null;
  try { sh = await S.store.get('share/' + S.pub.token); } catch (e) { sh = null; }
  if (!sh || !sh.eventId) { S.pub.error = 'This link is not valid, or the event is no longer shared publicly.'; S.loadedEvents = true; render(); return; }
  S.pub.evId = sh.eventId;
  const id = sh.eventId;
  S.pubUnsub = S.store.watchDoc(P.event(id), d => {
    if (!d || !d.public || d.shareToken !== S.pub.token) { S.events = {}; S.pub.error = 'This event is no longer shared publicly.'; if (S.evId) { S.unsub.forEach(u => { try { u(); } catch (e) { /* ignore */ } }); S.unsub = []; S.evId = null; } }
    else { S.events = { [id]: Object.assign({}, d, { id }) }; S.pub.error = ''; if (S.evId !== id) openEvent(id); }
    S.loadedEvents = true; render();
  }, e => { S.pub.error = 'This event is not shared publicly.'; S.loadedEvents = true; render(); dbErr(e); });
}

/* ===== v1.8: Go live / End live ===== */
/* Before the tournament starts the director sees a readiness checklist (setup, competitors and judges checked in,
   rings with managers and helpers confirmed ready). "Go live" publishes the event (public spectator link on the
   Vercel + Firebase site) and marks it live; "End live" shuts the public link off when the tournament is complete. */
function ringsInUse() {
  const ids = new Set();
  for (const dv of DC.divs) { if (!divEntrants(dv.id).length) continue; [dv.ringId, ...Object.values(dv.segRings || {})].forEach(r => { if (S.d.rings[r]) ids.add(r); }); }
  return DC.rings.filter(r => ids.has(r.id));
}
/** Officials a ring needs at once: the largest panel among the divisions it runs (kata judges, or 6 for kumite). */
function ringNeed(rid) {
  let n = 0;
  for (const dv of DC.divs) {
    if (!divEntrants(dv.id).length) continue;
    const rings = new Set([dv.ringId, ...Object.values(dv.segRings || {})]); if (!rings.has(rid)) continue;
    const k = kindOf(dv); n = Math.max(n, k === 'kata' ? (scoringOf(dv).judges || 5) : k === 'fukugo' ? 6 : 6);
  }
  return n;
}
function liveChecks() {
  const out = [], add = (ok, label, detail, tab, hard) => out.push({ ok, label, detail, tab, hard: hard !== false });

async function drawDivision(did) {
  const dv = DC.divBy[did]; if (!dv) return;
  const bs = bracketState(did);
  if (bs.results) { toast('This bracket already has results. Clear them before redrawing.', true); return; }
  const ents = divEntrants(did);
  if (!ents.length) { toast('No entrants in this division.', true); return; }
  if (bs.drawn && !(await confirmBox(`Redraw ${dv.name}? The current draw is replaced.`, 'Redraw'))) return;
  const clash = KT.seedClashes(dv.seeds);
  if (Object.keys(clash).length) { toast(seedClashText(clash) + ' Fix the seeds in Settings first.', true); return; }
  const list = ents.map(id => ({ id, seed: (dv.seeds || {})[id] || 0, group: entGroup(id) }));
  const br = KT.generateBracket(dv, list);
  const ok = await guard(() => S.store.set(P.live(S.evId, 'brackets', did), br), `Drew ${dv.name}`);
  if (ok) { S.ui.bracketDiv = did; }
}
async function drawAll() {
  const ready = DC.divs.filter(d => !S.d.brackets[d.id] && divEntrants(d.id).length >= 1);
  if (!ready.length) { toast('Every division with entrants is already drawn.'); return; }
  if (!(await confirmBox(`Draw ${plural(ready.length, 'division')} now?`, 'Draw'))) return;
  for (const d of ready) {
    const clash = KT.seedClashes(d.seeds);
    if (Object.keys(clash).length) { toast(`${d.name}: ` + seedClashText(clash), true); return; }
    const list = divEntrants(d.id).map(id => ({ id, seed: (d.seeds || {})[id] || 0, group: entGroup(id) }));
    if (!(await guard(() => S.store.set(P.live(S.evId, 'brackets', d.id), KT.generateBracket(d, list))))) return;
  }
  toast(`Drew ${plural(ready.length, 'division')}`);
}
async function deleteEvent(id) {
  const ev = S.events[id];
  if (!(await confirmBox(`Delete “${ev.name}” and everything in it? This cannot be undone.`, 'Delete event', true))) return;
  const paths = [];
  for (const c of ['competitors', 'teams', 'divisions', 'rings', 'sessions', 'judges']) Object.keys(S.d[c]).forEach(x => paths.push(P.doc(id, c, x)));
  Object.keys(S.d.pv).forEach(x => paths.push(P.pv(id, x)));
  for (const c of ['brackets', 'attendance', 'ringstate', 'ringready']) Object.keys(S.d[c]).forEach(x => paths.push(P.live(id, c, x)));
  closeModal();
  for (const p of paths) await guard(() => S.store.del(p));
  await guard(() => S.store.del(P.event(id)), 'Event deleted');
  openEvent(null);
}

async function createDemo(kind) {
  const C = DEMOS[kind] || DEMOS.local;

  const start = todayISO();
  const ev = { name: C.name, kind: 'tournament', level: C.level, startDate: start, endDate: start, location: C.location, host: C.host,
    eventTypes: KT.EVENT_ORDER.slice(), defaultFormat: 'SE', bronze: 'two', demo: true, demoKind: kind, staffIds: [], createdAt: new Date().toISOString(),
    directorIds: S.myId ? [S.myId] : [], managerIds: [], createdBy: S.myId || '' };
  toast('Creating demo tournament…');
  if (!(await guard(() => S.store.set(P.event(id), ev)))) return;
  const y = +start.slice(0, 4);
  const first = { M: ['Alden', 'Bram', 'Caspian', 'Dorian', 'Emeric', 'Faris', 'Gideon', 'Hollis', 'Ivo', 'Jonah', 'Kellan', 'Lorcan', 'Mateo', 'Niko', 'Osric', 'Pavel'], F: ['Ada', 'Brielle', 'Celeste', 'Delphine', 'Elowen', 'Fenna', 'Greer', 'Hazel', 'Isolde', 'Juno', 'Keiko', 'Liora'] };
  const last = ['Ashby', 'Brandt', 'Corwin', 'Dale', 'Everly', 'Fairbanks', 'Garrow', 'Hale', 'Ingram', 'Joss', 'Kerr', 'Lowell', 'Marsh', 'Nye', 'Oakes', 'Pryor', 'Quill', 'Rowan', 'Sato', 'Tanaka'];
  const comps = [];
  let n = 0;
  const mk = (g, age, rank, events) => { const c = { id: uid() + n, g, age, rank, events }; n++; comps.push(c); return c; };
  for (let i = 0; i < C.men; i++) mk('M', 22 + (i * 2) % 30, 'd' + (1 + (i % 4)), i < 8 ? ['IKATA', 'IKUMITE', 'FUKUGO'] : i < Math.max(12, C.men - 6) ? ['IKATA', 'IKUMITE'] : ['IKATA']);
  for (let i = 0; i < C.women; i++) mk('F', 22 + (i * 4) % 24, 'd' + (1 + (i % 3)), ['IKATA', 'IKUMITE', 'TKATA']);
  for (let i = 0; i < C.juniors; i++) mk('M', 16 + (i % 3), 'd1', ['IKATA', 'IKUMITE', 'TKUMITE']);
  for (let i = 0; i < C.kyu; i++) mk('F', 30 + i, 'k' + (1 + (i % 3)), ['IKATA', 'ENBU']);
  const fm = { M: 0, F: 0 };
  const divs = KT.blackBeltDivisions(KT.EVENT_ORDER).concat(KT.kyuDivisions({ label: 'Adult', minRank: 'k5', maxRank: 'k1', minAge: 18, maxAge: null }, ['IKATA', 'ENBU']));
  const rings = Array.from({ length: C.rings }, (_, k) => ({ id: uid() + 'r' + (k + 1), name: 'Ring ' + (k + 1), order: k + 1, managerIds: [] }));
  for (const r of rings) await guard(() => S.store.set(P.doc(id, 'rings', r.id), r));
  const kata = d => d.eventType === 'IKATA' || d.eventType === 'TKATA' || d.eventType === 'ENBU';
  const ringFor = d => C.rings <= 2 ? (kata(d) ? rings[0].id : rings[1].id)
    : (d.eventType === 'IKATA' ? rings[0].id : d.eventType === 'IKUMITE' ? rings[1].id : rings[2].id);
  let order = 0;
  for (const d of divs) { d.ringId = ringFor(d); d.ringOrder = order++; d.bronze = 'two'; if (d.eventType === 'IKUMITE' && d.group === 'Senior') d.format = d.gender === 'F' ? 'DES' : 'DE'; if (d.eventType === 'IKATA' && d.group === 'Junior') d.format = 'RR'; await guard(() => S.store.set(P.doc(id, 'divisions', uid() + order), d)); }
  for (const c of comps) {
    const f = first[c.g][fm[c.g]++ % first[c.g].length], l = last[(n = (n * 7 + 3) % last.length)];
    const dob = `${y - c.age}-0${1 + (c.age % 8)}-1${c.age % 9}`;
    const gi = comps.indexOf(c) % C.groups.length, grp = C.groups[gi];
    const rec = { firstName: f, lastName: l, gender: c.g, rank: c.rank, dojo: '', state: '', country: '', waiver: true, feePaid: true, checkedIn: true, status: 'active', events: c.events, divOverride: {}, age: KT.ageOn(dob, start), createdAt: new Date().toISOString() };
    if (C.field === 'dojo') { rec.dojo = grp; rec.state = 'Riverside'; rec.country = 'Example'; }
    else if (C.field === 'state') { rec.state = grp; rec.dojo = C.clubs[comps.indexOf(c) % C.clubs.length]; rec.country = 'Example'; }
    else { rec.country = grp; rec.dojo = 'Team ' + grp; }
    c.dojo = rec.dojo;
    await guard(async () => {
      await S.store.set(P.doc(id, 'competitors', c.id), rec);
      await S.store.set(P.pv(id, c.id), { dob, email: '', phone: '', emergencyName: 'Demo contact', emergencyPhone: '000-000-0000', feeAmount: '', notes: 'Fictional demo record' });
    });
  }
  const women = comps.filter(c => c.events.includes('TKATA')), juniors = comps.filter(c => c.events.includes('TKUMITE')), enbu = comps.filter(c => c.events.includes('ENBU'));
  const teams = [];
  for (let t = 0; t + 3 <= women.length && t < 9; t += 3) teams.push({ name: `Senior Women ${String.fromCharCode(65 + t / 3)}`, eventType: 'TKATA', memberIds: women.slice(t, t + 3).map(c => c.id) });
  for (let t = 0; t + 3 <= juniors.length && t < 6; t += 3) teams.push({ name: `Junior Men ${t / 3 + 1}`, eventType: 'TKUMITE', memberIds: juniors.slice(t, t + 3).map(c => c.id) });
  for (let t = 0; t + 2 <= enbu.length && t < 6; t += 2) teams.push({ name: `Enbu Pair ${t / 2 + 1}`, eventType: 'ENBU', memberIds: enbu.slice(t, t + 2).map(c => c.id) });
  for (const t of teams) await guard(() => S.store.set(P.doc(id, 'teams', uid()), Object.assign({ dojo: '', divisionId: '', status: 'active' }, t, { gender: t.eventType === 'TKUMITE' ? 'M' : 'F' })));
  const jn = ['Haruki Sato', 'Mireille Laurent', 'Tomas Varga', 'Anika Rao', 'Callum Reid', 'Sofia Moreau', 'Elias Brandt', 'Noor Haddad', 'Pavel Novak', 'Ines Duarte', 'Kofi Mensah', 'Lena Fischer', 'Ravi Iyer', 'Ana Petrova', 'Diego Ruiz', 'Yuki Mori', 'Lucas Silva', 'Marta Kowalska', 'Thabo Nkosi', 'Chloe Martin', 'Giulia Rossi', 'Liam Walsh', 'Aiko Tanaka', 'Samir Patel', 'Emma Clarke', 'Jonas Berg', 'Rosa Diaz', 'Omar Haddad', 'Mei Lin', 'Peter Novak'];
  const perRing = 7, nJ = Math.min(jn.length, C.rings * perRing + 1), [lo, hi] = C.judgeLv;
  for (let i = 0; i < nJ; i++) {
    const ka = lo + ((i * 3) % (hi - lo + 1)), ku = lo + ((i * 5 + 1) % (hi - lo + 1));
    const g = C.groups[i % C.groups.length];
    await guard(() => S.store.set(P.doc(id, 'judges', uid() + 'j' + i), { name: jn[i], country: C.field === 'country' ? g : 'Example', region: C.field === 'state' ? g : '', dojo: C.field === 'dojo' ? g : C.field === 'state' ? C.clubs[i % C.clubs.length] : '', kataLevel: ka, kumiteLevel: ku, ringId: i < C.rings * perRing ? rings[i % C.rings].id : '', notes: 'Fictional demo judge' }));
  }
  openEvent(id);
  toast(`${C.name.replace(' (demo)', '')} ready. Draw brackets from the Divisions tab.`);
}

/* ---------- touch-and-hold drag to reorder divisions within a ring ---------- */
const HOLD_MS = 450;
function wireRingDrag() {
  let hold = null, drag = null;
  const cancelHold = () => { if (hold) { clearTimeout(hold.t); hold = null; } };
  const blockScroll = e => { if (drag) e.preventDefault(); };
  document.addEventListener('pointerdown', e => {
    const row = e.target.closest('.rdiv'); if (!row || e.target.closest('select') || !isDirector()) return;
    if (e.button != null && e.button !== 0) return;
    cancelHold();
    hold = { row, x: e.clientX, y: e.clientY, id: e.pointerId, t: setTimeout(() => startDrag(row, e.clientY), HOLD_MS) };
    row.classList.add('pressing');
  });
  function startDrag(row, y) {
    hold = null; row.classList.remove('pressing');
    const list = row.parentElement;
    drag = { row, list, startOrder: [...list.children].map(x => x.dataset.id), lastY: y };
    S.dragging = true;
    row.classList.add('dragging'); list.classList.add('sorting');
    document.addEventListener('touchmove', blockScroll, { passive: false });
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) { /* ignore */ }
  }
  document.addEventListener('pointermove', e => {
    if (hold && (Math.abs(e.clientX - hold.x) > 8 || Math.abs(e.clientY - hold.y) > 8)) { hold.row.classList.remove('pressing'); cancelHold(); return; }
    if (!drag) return;
    e.preventDefault();
    const rows = [...drag.list.children].filter(x => x !== drag.row);
    let before = null;
    for (const r of rows) { const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { before = r; break; } }
    if (before !== drag.row.nextElementSibling) drag.list.insertBefore(drag.row, before);
    [...drag.list.children].forEach((r, i) => { const n = r.querySelector('.rnum'); if (n) n.textContent = i + 1; });
  }, { passive: false });
  const end = async () => {
    if (hold) { hold.row.classList.remove('pressing'); cancelHold(); }
    if (!drag) return;
    const { row, list, startOrder } = drag; drag = null; S.justDragged = Date.now();
    document.removeEventListener('touchmove', blockScroll);
    row.classList.remove('dragging'); list.classList.remove('sorting');
    const order = [...list.children].map(x => x.dataset.id);
    S.dragging = false;
    if (order.join('|') !== startOrder.join('|')) await saveRingOrder(order);
    if (S.renderPending) { S.renderPending = false; } render();
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  document.addEventListener('contextmenu', e => { if (e.target.closest('.rdiv')) e.preventDefault(); });
  // keyboard: Alt+↑ / Alt+↓ moves the focused division
  document.addEventListener('keydown', async e => {
    const row = e.target.closest && e.target.closest('.rdiv'); if (!row || !e.altKey || !isDirector()) return;
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    const list = row.parentElement, ids = [...list.children].map(x => x.dataset.id), i = ids.indexOf(row.dataset.id), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await saveRingOrder(ids);
    setTimeout(() => { const el = document.querySelector(`.rdiv[data-id="${row.dataset.id}"]`); if (el) el.focus(); }, 60);
  });
}
async function saveRingOrder(ids) {
  let changed = 0;
  for (let k = 0; k < ids.length; k++) {
    const d = DC.divBy[ids[k]]; if (!d || (d.ringOrder || 0) === k) continue;
    changed++; await guard(() => S.store.update(P.doc(S.evId, 'divisions', d.id), { ringOrder: k }));
  }
  if (changed) toast('Running order saved');
}

function wire() {
  wireRingDrag();
  // timing buttons act on press, not on release: a mouse click whose press and release straddle a clock repaint can be
  // dropped by the browser (MacBook click vs. tap), and the timekeeper needs Stop to be instant anyway.
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-press]'); if (!el || el.disabled || (e.button != null && e.button !== 0)) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    e.preventDefault(); fn(el, e);
  });
  document.addEventListener('click', e => {
    if (e.detail > 0 && e.target.closest('[data-press]')) return;   // pointer clicks on press buttons were handled on pointerdown; keyboard (detail 0) still clicks
    const el = e.target.closest('[data-act]');
    if (!e.target.closest('.dd')) $$('.dd-list').forEach(x => { x.hidden = true; });
    if (!el) {
      const t = e.target.closest('[data-tap]');
      if (t && !e.target.closest('select,button,a,input') && !(S.justDragged && Date.now() - S.justDragged < 400) && ACT[t.dataset.tap]) ACT[t.dataset.tap](t, e);
      return;
    }
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'A') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#confirm').hidden) confirmDone(false); else if (!$('#modal').hidden) closeModal(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.bm[role="button"]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el, e); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-input$="-search"]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el, e); });
  document.addEventListener('submit', async e => {
    const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
    const k = f.dataset.form;
    if (k === 'event') {
      const v = fd(f), id = f.dataset.id || uid(), old = S.events[f.dataset.id] || {};
      if (!v.name || !v.startDate) { toast('Name and start date are required.', true); return; }
      if (v.kind === 'tournament' && !(v.eventTypes || []).length) { toast('Pick at least one event.', true); return; }
      const ev = Object.assign({}, old, v, { id: undefined, staffIds: old.staffIds || [], createdAt: old.createdAt || new Date().toISOString(),
        directorIds: old.directorIds || (S.myId ? [S.myId] : []), managerIds: old.managerIds || [], createdBy: old.createdBy || S.myId || '' }); delete ev.id;
      const ok = await guard(() => S.store.set(P.event(id), ev), f.dataset.id ? 'Event saved' : 'Event created');
      if (!ok) return;
      closeModal();
      if (!f.dataset.id) openEvent(id);
      else {
        const asOf = v.ageAsOf || v.startDate, oldAsOf = old.ageAsOf || old.startDate;
        if (asOf !== oldAsOf) for (const c of DC.comps) if (c.dob) await guard(() => S.store.update(P.doc(id, 'competitors', c.id), { age: KT.ageOn(c.dob, asOf) }));
      }
    }
    else if (k === 'comp') saveComp(f);
    else if (k === 'team') saveTeam(f);
    else if (k === 'div') saveDiv(f);
    else if (k === 'std') saveStd(f, false);
    else if (k === 'kyu') saveStd(f, true);
    else if (k === 'ring') {
      const v = fd(f); if (!v.name) return;
      const id = f.dataset.id; const ok = await guard(() => id ? S.store.update(P.doc(S.evId, 'rings', id), { name: v.name }) : S.store.set(P.doc(S.evId, 'rings', uid()), { name: v.name, order: DC.rings.length + 1, managerIds: [] }), 'Ring saved');
      if (ok) closeModal();
    }
    else if (k === 'judge') saveJudge(f);
    else if (k === 'invite') saveInvite(f);
    else if (k === 'code') redeemCode(fd(f).code);
    else if (k === 'session') {
      const v = fd(f); if (!v.title || !v.date) { toast('Title and date are required.', true); return; }
      const ok = await guard(() => S.store.set(P.doc(S.evId, 'sessions', f.dataset.id || uid()), v), 'Session saved'); if (ok) closeModal();
    }
  });
}

async function init() {
  readUIPrefs();
  parsePublic(); loadMyReqs();
  wire();
  render();
  if (window.KT_FIREBASE_CONFIG && window.firebase) {
    try { if (!(await initFirebase(window.KT_FIREBASE_CONFIG))) return; }
    catch (e) { console.error(e); S.store = LocalStore(); toast('Could not reach Firebase. Working in local mode.', true); }
    if (S.pub) { S.readOnly = true; startPublic(); } else subscribeEvents(); render(); return;
  }
  let db = null, user = null;
  const cl = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
  if (cl) {
    try { [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); } catch (e) { db = null; }
    cl.use('downloads').then(x => { S.downloads = x; }).catch(() => {});
  }
  if (db) {
    S.store = CloudStore(db); S.user = user;
    if (user) {
      try {
        const [me, canEd, canW, own] = await Promise.all([user.me(), user.canEdit(), user.can('data.write'), user.isOwner()]);
        // v1.7: director = the page's owner + people the owner makes directors; other editors are ring managers once assigned
        S.myId = me.id; S.isOwnerFlag = !!own; S.canEditor = !!canEd; S.isAdmin = !!own; S.isOrganizer = !!own; S.canWrite = canW; S.myEmail = String(me.email || '').toLowerCase(); S.myName = me.name || '';
        if (canW === false && !canEd) S.readOnly = true;
      } catch (e) { /* reads never reject */ }
    }
  } else {
    S.store = LocalStore();
  }
  if (S.pub) { S.readOnly = true; startPublic(); } else subscribeEvents();
  render();
}
init();
})();
