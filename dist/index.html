<style>
/* Layout: app bar + scrollable tab strip + single content column (max 1200px); modal sheets slide up on phones. */

  --gold: #b88a13; --silver: #7d8591; --bronze: #9b5a2a;
  --ok: #2c7a4b; --ok-soft: #e0f1e6;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --line: #2c3039; --line-2: #3a3f4a; --ai: #8fb0ea; --ai-soft: #1f2a3f;
  --aka: #ff5a67; --aka-soft: #3a1a1e; --aka-bg: #a51c2b; --shiro: #eef0f4; --shiro-ink: #121419;
  --gold: #e0b43c; --silver: #aab2bf; --bronze: #d08a55;
  --ok: #6fcf97; --ok-soft: #173024; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8a80; --bad-soft: #3a1b19;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121419; --panel: #1b1e25; --ink: #eceef2; --ink-2: #b4b9c4; --ink-3: #868c98;
  --line: #2c3039; --line-2: #3a3f4a; --ai: #8fb0ea; --ai-soft: #1f2a3f;
  --aka: #ff5a67; --aka-soft: #3a1a1e; --aka-bg: #a51c2b; --shiro: #eef0f4; --shiro-ink: #121419;
  --gold: #e0b43c; --silver: #aab2bf; --bronze: #d08a55;
  --ok: #6fcf97; --ok-soft: #173024; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8a80; --bad-soft: #3a1b19;

* { box-sizing: border-box; }

.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

:root[data-theme="dark"] .bar { background: #0b0c10; }

.bar-in { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; color: inherit; padding: 0; font: inherit; }
.brand .mark { width: 30px; height: 30px; border-radius: 50%; background: #fff; position: relative; flex: none; }

.brand > span { text-align: left; }

.brand small { display: block; font-size: .7rem; opacity: .65; letter-spacing: .08em; text-transform: uppercase; }
.bar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--ai-soft); color: var(--ai); white-space: nowrap; }
.bar .chip { background: rgba(255,255,255,.12); color: #fff; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.aka { background: var(--aka-soft); color: var(--aka); }
.chip.plain { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.bar select { width: auto; max-width: 220px; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.bar select option { color: #000; }

/* tabs */
.tabs { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 52px)); z-index: 15; }
.tabs-in { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 12px 10px; font: 600 .88rem var(--f-body); color: var(--ink-2); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--aka); }
.tab:focus-visible { outline: 2px solid var(--ai); outline-offset: -2px; }

main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 14px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font: 600 1.6rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--ai); }

/* buttons & inputs */
button, .btn { font: 600 .86rem var(--f-body); border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); padding: 8px 13px; cursor: pointer; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
button:hover { border-color: var(--ink-3); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ai); outline-offset: 1px; }
button.primary { background: var(--ai); border-color: var(--ai); color: #fff; }
:root[data-theme="dark"] button.primary { color: #0e1422; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0e1422; } }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
button.ghost { border-color: transparent; background: transparent; }
button.sm { min-height: 30px; padding: 4px 9px; font-size: .8rem; }
button:disabled { opacity: .45; cursor: not-allowed; }
label.f { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--ink-2); min-width: 0; }
label.f.req > span::after { content: " *"; color: var(--aka); }
input, select, textarea { font: .92rem var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; accent-color: var(--ai); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: .88rem; cursor: pointer; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.fgrid .span { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin: 0; min-width: 0; }
legend { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 0 6px; }
.search { max-width: 280px; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--ai-soft); }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* empty */
.empty { text-align: center; padding: 36px 16px; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty .mark-lg { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--line-2); position: relative; }
.empty .mark-lg::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: var(--aka); opacity: .8; }
.notice { border-radius: var(--r); padding: 10px 14px; font-size: .88rem; display: flex; gap: 10px; align-items: flex-start; }
.notice.warn { background: var(--warn-soft); color: var(--warn); } .notice.info { background: var(--ai-soft); color: var(--ai); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }

/* event cards */
.ev-card { text-align: left; display: grid; gap: 8px; align-content: start; cursor: pointer; width: 100%; font-weight: 400; justify-content: stretch; }
.ev-card:hover { border-color: var(--ai); }
.ev-card .date { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-2); }

/* aka / shiro */
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.belt { width: 5px; height: 22px; border-radius: 2px; flex: none; border: 1px solid var(--line-2); }
.belt.a { background: var(--aka); border-color: var(--aka); } .belt.b { background: var(--shiro); border-color: var(--ink-3); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dojo { font-size: .76rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* brackets */
.bracket-wrap { overflow-x: auto; padding-bottom: 6px; }
.bracket { display: flex; gap: 22px; min-width: min-content; align-items: stretch; padding: 4px 2px; }
.bcol { display: flex; flex-direction: column; gap: 8px; min-width: 210px; width: 210px; }
.bcol-in { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
.bcol > .label { text-align: center; margin-bottom: 2px; }
.bm { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; cursor: default; position: relative; font-size: .84rem; }
.bm.click { cursor: pointer; } .bm.click:hover { border-color: var(--ai); box-shadow: var(--shadow); }
.bm.ready { border-color: var(--ai); } .bm.live { border-color: var(--aka); box-shadow: 0 0 0 2px var(--aka-soft); }
.bm .ln { display: grid; grid-template-columns: 6px 1fr auto; gap: 8px; align-items: center; padding: 6px 9px 6px 0; min-height: 32px; }
.bm .ln + .ln { border-top: 1px solid var(--line); }
.bm .ln .strip { align-self: stretch; }
.bm .ln.a .strip { background: var(--aka); } .bm .ln.b .strip { background: var(--line-2); }
.bm .ln.win .name { color: var(--ink); } .bm .ln.lose .name { color: var(--ink-3); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--line-2); }
.bm .ln .sc { font: 600 .8rem var(--f-mono); color: var(--ink-2); }
.bm .ln.tbd .name { color: var(--ink-3); font-weight: 500; font-style: italic; }
.bm .meta { font-size: .68rem; color: var(--ink-3); padding: 3px 9px; background: var(--paper); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; }
.stage-h { margin: 6px 0 8px; }

/* medals */
.medal { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 .72rem var(--f-mono); color: #fff; flex: none; }
.medal.g { background: var(--gold); } .medal.s { background: var(--silver); } .medal.b { background: var(--bronze); }
.podium { display: grid; gap: 6px; }
.podium .pl { display: flex; gap: 10px; align-items: center; min-width: 0; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(12,14,20,.5); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--panel); border-radius: 14px; width: min(760px, 100%); max-height: calc(100% - 20px); overflow: auto; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr auto; }
.sheet.wide { width: min(1000px, 100%); }
.sheet-h { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sheet-b { padding: 16px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.sheet-f { position: sticky; bottom: 0; background: var(--panel); padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 640px) { .scrim { padding: 0; place-items: end stretch; } .sheet { border-radius: 14px 14px 0 0; max-height: 94%; width: 100%; } }
#confirm .sheet { width: min(420px, 100%); }

/* scoreboard */
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 230px) minmax(0, 1fr); gap: 10px; align-items: stretch; }
@media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .corner { padding: 8px; } .corner button { padding: 6px 4px; font-size: .74rem; } .corner .big { font-size: 2.4rem; } .board .mid { grid-column: 1 / -1; order: -1; } }
.corner { border-radius: 12px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.corner.a { background: var(--aka-bg); color: #fff; }
.corner.b { background: var(--shiro); color: var(--shiro-ink); border: 2px solid var(--line-2); }
.corner .who { font-weight: 700; font-family: var(--f-display); font-size: 1.02rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.corner .big { font: 700 3.2rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.corner .tally { font: 600 .78rem var(--f-mono); opacity: .85; }
.corner .btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.corner button { min-width: 0; overflow-wrap: anywhere; }
.corner button { min-height: 42px; font-size: .82rem; background: rgba(255,255,255,.14); color: inherit; border-color: rgba(255,255,255,.4); }
.corner.b button { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.22); color: var(--shiro-ink); }
.corner button.pen { font-weight: 500; }
.mid { display: grid; gap: 8px; align-content: start; justify-items: stretch; min-width: 150px; }
.clock { font: 700 2.3rem/1 var(--f-mono); font-variant-numeric: tabular-nums; text-align: center; padding: 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); }
.clock.zero { color: var(--aka); }
.phase { text-align: center; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ai); }
.log { font: .74rem var(--f-mono); color: var(--ink-3); max-height: 90px; overflow: auto; }
.judges { display: grid; gap: 8px; }
.jrow { display: grid; grid-template-columns: 48px 1fr 1fr; gap: 6px; align-items: center; }
.jrow button.on.a { background: var(--aka-bg); color: #fff; border-color: var(--aka-bg); }
.jrow button.on.b { background: var(--shiro); color: var(--shiro-ink); border: 2px solid var(--ink); }
.srow { display: grid; grid-template-columns: 90px repeat(var(--j, 5), minmax(52px, 1fr)) 80px; gap: 6px; align-items: center; }
.srow input { text-align: center; font-family: var(--f-mono); padding: 6px 2px; }
.srow .tot { font: 700 1.05rem var(--f-mono); text-align: right; }
.result-banner { border-radius: 10px; padding: 12px 14px; background: var(--ok-soft); color: var(--ok); font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bout { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 10px; }
.bout-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ring board */
.ring-card .now { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.ring-card .now .sc { font: 700 1.6rem var(--f-mono); padding: 0 6px; }
.queue { display: grid; gap: 4px; }
.queue .q { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; font-size: .84rem; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.queue .q .vs { font-size: .7rem; color: var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: .88rem; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
.pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px 3px 3px; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; }
.person img { width: 22px; height: 22px; border-radius: 50%; }
.dd { position: relative; }
.dd-list { position: absolute; left: 0; right: 0; top: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); z-index: 5; max-height: 240px; overflow: auto; }
.dd-list button { width: 100%; justify-content: flex-start; border: 0; border-radius: 0; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(12px); opacity: .6; } } }

/* kata score pools */
table.kp tr.adv td { background: color-mix(in srgb, var(--ok-soft) 55%, transparent); }
.jcell { white-space: nowrap; }
.js { display: inline-block; min-width: 2.6em; text-align: center; font: 500 .8rem var(--f-mono); color: var(--ink-2); }
.js.dropped { color: var(--ink-3); text-decoration: line-through; }
.kprow { display: grid; grid-template-columns: repeat(var(--j, 6), minmax(56px, 1fr)); gap: 6px; }
.kprow input { text-align: center; font-family: var(--f-mono); }
.kp-total { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.kp-total b { font: 700 2rem var(--f-mono); }
</style>

<script>/* Karate Event Tracker v1.1.0 */
/* ============================================================
   Karate Event Tracker — core logic (pure, no DOM)
   Brackets, divisions, ITKF (2009) scoring. Portable to native.
   ============================================================ */
const KT = (function () {
  'use strict';
  const VERSION = '1.1.0';

  /* ---------- reference data ---------- */
  const EVENT_TYPES = {
    IKATA:   { label: 'Individual Kata',   short: 'Kata',       team: false, genders: ['M', 'F'],      kind: 'kata',       defMethod: 'flags' },

}
function fbUserShim(fs) {

        out[id] = toProfile(id, FB.cache[id]);

}

    const un = DC.assign.unplaced;

  const placedIn = {};

/* ---------- teams ---------- */
function teamsHTML() {
  const ev = curEvent();
  const types = (ev.eventTypes || KT.EVENT_ORDER).filter(t => KT.EVENT_TYPES[t].team);
  const unplaced = new Set(DC.assign.unplaced.filter(u => u.kind === 'team').map(u => u.id));
  const placed = {}; for (const did in DC.assign.byDiv) for (const id of DC.assign.byDiv[did]) placed[id] = did;
  const secs = types.map(et => {
    const T = KT.EVENT_TYPES[et], list = DC.teams.filter(t => t.eventType === et).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    const need = DC.comps.filter(c => (c.events || []).includes(et) && c.status !== 'withdrawn' && !DC.teams.some(t => t.eventType === et && (t.memberIds || []).includes(c.id)));
    return `<div class="card flush"><div class="card-h"><div><h3>${esc(T.label)}</h3><div class="small muted">${T.size[0] === T.size[1] ? T.size[0] : T.size[0] + '–' + T.size[1]} members · ${T.genders.map(g => KT.GENDERS[g]).join(' / ')}</div></div>
      <button class="sm" data-act="team-new" data-et="${et}">New team</button></div>
      ${need.length ? `<div class="notice info" style="margin:10px 16px 0">${plural(need.length, 'competitor')} entered ${esc(T.short)} without a team: ${need.slice(0, 6).map(c => esc(c.firstName + ' ' + c.lastName)).join(', ')}${need.length > 6 ? '…' : ''}</div>` : ''}
      <div class="tw"><table><tbody>${list.map(t => {
        const mem = (t.memberIds || []).map(id => DC.compBy[id]).filter(Boolean);
        return `<tr class="click" data-act="team-edit" data-id="${esc(t.id)}"><td><div class="name">${esc(t.name)}</div><div class="dojo">${esc(t.dojo || '')}</div></td>
        <td class="small">${mem.map(m => esc(m.firstName + ' ' + m.lastName)).join(', ') || '<span class="muted">No members</span>'}</td>
        <td>${unplaced.has(t.id) ? '<span class="chip bad">No division</span>' : placed[t.id] ? `<span class="small">${esc(DC.divBy[placed[t.id]].name)}</span>` : ''}${t.status === 'withdrawn' ? ' <span class="chip bad">Withdrawn</span>' : ''}</td></tr>`;
      }).join('') || `<tr><td class="muted">No teams yet.</td></tr>`}</tbody></table></div></div>`;
  }).join('');
  return eventHeader() + (types.length ? `<div class="stack">${secs}</div>` : `<div class="card empty"><p>This tournament offers no team events. Turn them on in Event settings.</p></div>`);
}

    return `<tr><td><button class="ghost sm" style="padding:0;min-height:0;text-align:left;justify-content:flex-start" data-act="div-edit" data-id="${esc(d.id)}"><span class="name">${esc(d.name)}</span></button>
        <div class="dojo">${d.belt === 'kyu' ? esc(KT.rankLabel(d.minRank) + ' – ' + KT.rankLabel(d.maxRank)) + ' · ' : ''}${ageRange(d)}</div></td>

}
function ageRange(d) {
  const lo = d.minAge === '' || d.minAge == null ? null : d.minAge, hi = d.maxAge === '' || d.maxAge == null ? null : d.maxAge;
  if (lo == null && hi == null) return 'All ages';
  if (hi == null) return `Age ${lo}+`;
  if (lo == null) return `Age ≤${hi}`;
  return lo === hi ? `Age ${lo}` : `Age ${lo}–${hi}`;
}

/* ---------- rings ---------- */
function ringsHTML() {
  const cards = DC.rings.map(r => {

      ${free.length ? `<select id="ring-add-${esc(r.id)}" data-change="ring-adddiv" data-ring="${esc(r.id)}" style="margin-top:8px">${opt('', 'Assign a division…', '')}${free.map(d => opt(d.id, `${d.name} (${divEntrants(d.id).length})`, '')).join('')}</select>` : ''}</div></div>`;

/* ---------- mat / ring board ---------- */
function ringQueue(rid) {
  const out = [];
  const divs = DC.divs.filter(d => d.ringId === rid).sort((a, b) => (a.ringOrder || 0) - (b.ringOrder || 0));
  for (const d of divs) {
    const br = S.d.brackets[d.id]; if (!br) continue;
    if (br.format === 'KP') { for (const p of KT.kpQueue(br)) out.push({ did: d.id, kp: p }); continue; }
    for (const m of KT.readyMatches(br, DC.res[d.id])) out.push({ did: d.id, m, r: DC.res[d.id][m.id] });
  }
  return out;
}
function nowHTML(rs) {
  if (!rs || !rs.did || !S.d.brackets[rs.did]) return '';
  const dv = DC.divBy[rs.did], br = S.d.brackets[rs.did];
  if (rs.kp) {
    const q = br.format === 'KP' ? KT.kpQueue(br).find(x => x.key === rs.kp) : null;
    if (!q) return '';
    return `<div class="label">${esc(dv ? dv.name : '')} · ${esc(q.label)}</div>
      <div class="now" style="grid-template-columns:1fr auto"><div class="side"><span class="belt a" style="background:var(--ai);border-color:var(--ai)"></span><span style="min-width:0"><div class="name">${esc(entName(q.id))}</div><div class="dojo">${esc(entDojo(q.id))}${rs.kata ? ' · ' + esc(rs.kata) : ''}</div></span></div>
      <div class="sc num">${rs.score != null && rs.score !== '' ? esc(rs.score) : ''}</div></div>`;
  }
  const res = (DC.res[rs.did] || {})[rs.mid];
  if (!res || res.status !== 'ready') return '';
  return `<div class="label">${esc(dv ? dv.name : '')} · ${esc(KT.matchLabel(br.matches[rs.mid], br))}</div>
    <div class="now"><div class="side"><span class="belt a"></span><span style="min-width:0"><div class="name">${esc(entName(res.a))}</div><div class="dojo">${esc(entDojo(res.a))}</div></span></div>
    <div class="sc num">${rs.score ? `${esc(rs.score.a)}–${esc(rs.score.b)}` : 'vs'}</div>
    <div class="side" style="justify-content:flex-end;text-align:right"><span style="min-width:0"><div class="name">${esc(entName(res.b))}</div><div class="dojo">${esc(entDojo(res.b))}</div></span><span class="belt b"></span></div></div>
    ${rs.phase ? `<div class="phase">${esc(rs.phase)}</div>` : ''}`;
}
function ringBoardHTML(rings, withActions) {
  if (!rings.length) return `<div class="card small muted">No rings set up yet.</div>`;
  return `<div class="grid2">${rings.map(r => {
    const rs = S.d.ringstate[r.id], q = ringQueue(r.id);
    const now = nowHTML(rs);
    const isNow = x => rs && x.did === rs.did && (x.kp ? rs.kp === x.kp.key : x.m.id === rs.mid);
    const next = q.filter(x => !isNow(x)).slice(0, withActions ? 12 : 3);
    const openBtn = withActions && now && canScoreDiv(rs.did) ? `<div class="row" style="margin-top:8px"><button class="primary" ${rs.kp ? `data-act="kp-score" data-did="${esc(rs.did)}" data-key="${esc(rs.kp)}"` : `data-act="score" data-did="${esc(rs.did)}" data-mid="${esc(rs.mid)}"`}>Open scoresheet</button></div>` : '';
    return `<div class="card ring-card stack"><div class="row between"><h3>${esc(r.name)}</h3><span class="chip ${q.length ? '' : 'plain'}">${q.length} waiting</span></div>
      <div>${now || '<div class="small muted">Nothing on the mat.</div>'}${openBtn}</div>
      <div class="queue"><div class="label">Up next</div>${next.map(x => {
        const can = withActions && canScoreDiv(x.did);
        if (x.kp) return `<div class="q" style="grid-template-columns:1fr auto"><span class="side"><span class="belt a" style="background:var(--ai);border-color:var(--ai)"></span><span class="name">${esc(entName(x.kp.id))}</span></span>
          <span class="vs">${can ? `<button class="sm" data-act="kp-score" data-did="${esc(x.did)}" data-key="${esc(x.kp.key)}">Score</button>` : 'kata'}</span></div>
          <div class="tiny muted" style="margin-top:-4px">${esc(DC.divBy[x.did].name)} · ${esc(x.kp.label)}</div>`;
        return `<div class="q"><span class="side"><span class="belt a"></span><span class="name">${esc(entName(x.r.a))}</span></span>
        <span class="vs">${can ? `<button class="sm" data-act="score" data-did="${esc(x.did)}" data-mid="${esc(x.m.id)}">Score</button>` : 'vs'}</span>
        <span class="side" style="justify-content:flex-end"><span class="name">${esc(entName(x.r.b))}</span><span class="belt b"></span></span></div>
        <div class="tiny muted" style="margin-top:-4px">${esc(DC.divBy[x.did].name)} · ${esc(KT.matchLabel(x.m, S.d.brackets[x.did]))}${kindOf(DC.divBy[x.did]) === 'fukugo' ? ' · ' + (KT.fukugoPart(x.m, S.d.brackets[x.did]) === 'kitei' ? 'Ki-tei' : 'Kumite') : ''}</div>`;
      }).join('') || '<div class="small muted">Nothing waiting.</div>'}</div></div>`;
  }).join('')}</div>`;
}
function matHTML() {
  const mine = myRingIds();
  const r = role();
  let rings = DC.rings;
  const sel = S.ui.ring;
  if (sel) rings = rings.filter(x => x.id === sel);

    + note + ringBoardHTML(rings, true);
}

/* ---------- brackets ---------- */
function bracketsHTML() {
  const drawn = DC.divs.filter(d => S.d.brackets[d.id]);

      const ds = drawn.filter(d => d.ringId === r.id); return ds.length ? `<optgroup label="${esc(r.name)}">${ds.map(d => opt(d.id, d.name, did)).join('')}</optgroup>` : '';
    }).join('')}${drawn.filter(d => !S.d.rings[d.ringId]).length ? `<optgroup label="No ring">${drawn.filter(d => !S.d.rings[d.ringId]).map(d => opt(d.id, d.name, did)).join('')}</optgroup>` : ''}</select>`;
  if (!did) return eventHeader() + `<div class="section-h">${picker}</div><div class="card empty"><div class="mark-lg"></div><h2>No brackets yet</h2><p class="muted">${isDirector() ? 'Draw brackets from the Divisions tab once competitors are registered.' : 'Brackets appear here once the director draws them.'}</p>${isDirector() ? '<button data-act="tab" data-v="divisions">Go to Divisions</button>' : ''}</div>`;
  const dv = DC.divBy[did], br = S.d.brackets[did];
  const bs = bracketState(did);
  const dirActs = isDirector() ? `<button class="sm" data-act="div-edit" data-id="${esc(did)}">Division settings</button>${!bs.results ? `<button class="sm" data-act="draw" data-id="${esc(did)}">Redraw</button>` : ''}` : '';
  return eventHeader() + `<div class="section-h">${picker}<div class="row">${dirActs}</div></div>
    <div class="row small muted">${esc(KT.FORMATS[br.format])} · ${esc(scoringLabel(dv))} · ${plural((br.entrants || []).length, 'entrant')}${S.d.rings[dv.ringId] ? ' · ' + esc(S.d.rings[dv.ringId].name) : ''}</div>
    ${bs.changed && !bs.complete ? `<div class="notice warn">Entrants changed since this bracket was drawn.${isDirector() && !bs.results ? ' Redraw to include them.' : ' Results already exist; late changes need a manual decision.'}</div>` : ''}
    ${podiumHTML(did)}${bracketViewHTML(did)}`;
}
function podiumHTML(did) {
  const pl = DC.pl[did]; if (!pl || !pl.gold) return pl && pl.tie ? `<div class="notice warn">Pool finished with a tie that the rules cannot break. ${isDirector() || canScoreDiv(did) ? `<button class="sm" data-act="tiebreak" data-did="${esc(did)}" data-pool="A">Set tiebreak order</button>` : 'Waiting for the director.'}</div>` : '';
  const line = (cls, lbl, id) => id ? `<div class="pl"><span class="medal ${cls}">${lbl}</span><span style="min-width:0"><div class="name">${esc(entName(id))}</div><div class="dojo">${esc(entDojo(id))}</div></span></div>` : '';
  return `<div class="card"><div class="row between"><h3>${pl.complete ? 'Final placings' : 'Placings so far'}</h3>${pl.complete ? '<span class="chip ok">Finished</span>' : ''}</div><div class="podium" style="margin-top:8px">${line('g', '1', pl.gold)}${line('s', '2', pl.silver)}${(pl.bronze || []).map(b => line('b', '3', b)).join('')}</div></div>`;
}
function bmHTML(did, m, res, live) {
  const r = res[m.id]; if (!r) return '';
  if (r.status === 'void' || r.status === 'skip') return `<div class="bm" style="opacity:.45"><div class="ln tbd"><span class="strip"></span><span class="name">${r.status === 'skip' ? 'Not needed' : 'No match'}</span><span></span></div></div>`;
  const canS = canScoreDiv(did) && (r.status === 'ready' || r.status === 'done');
  const res1 = r.result || {};
  const ln = (side) => {
    const id = r[side], hint = side === 'a' ? r.hintA : r.hintB;
    const cls = !id ? 'tbd' : r.status === 'done' || r.status === 'bye' ? (r.winner === id ? 'win' : 'lose') : '';
    const sc = r.status === 'done' && res1.pts ? res1.pts[side] : '';
    return `<div class="ln ${side} ${cls}"><span class="strip"></span><span style="min-width:0"><div class="name">${id ? esc(entName(id)) : r.status === 'bye' ? 'Bye' : esc(hint || 'TBD')}</div>${id ? `<div class="dojo">${esc(entDojo(id))}</div>` : ''}</span><span class="sc">${sc === '' || sc == null ? '' : esc(sc)}</span></div>`;
  };
  return `<div class="bm ${r.status === 'ready' ? 'ready' : ''} ${live ? 'live' : ''} ${canS ? 'click' : ''}" ${canS ? `data-act="score" data-did="${esc(did)}" data-mid="${esc(m.id)}" tabindex="0" role="button"` : ''}>${ln('a')}${ln('b')}
    <div class="meta"><span>${esc(m.id)}${kindOf(DC.divBy[did]) === 'fukugo' ? ' · ' + (KT.fukugoPart(m, S.d.brackets[did]) === 'kitei' ? 'Ki-tei' : 'Kumite') : ''}</span><span>${r.status === 'done' ? esc(res1.method || '') : r.status === 'bye' ? 'Bye' : r.status === 'ready' ? (live ? 'On the mat' : 'Ready') : ''}</span></div></div>`;
}
function bracketViewHTML(did) {
  const br = S.d.brackets[did], res = DC.res[did] || {};
  if (br.format === 'KP') return kpViewHTML(did);
  const ms = Object.values(br.matches || {});
  if (!ms.length) return `<div class="card small muted">Only one entrant — awarded automatically.</div>`;
  const live = Object.values(S.d.ringstate).find(x => x.did === did);
  const liveId = live ? live.mid : null;
  const cols = (stage, title) => {
    const list = ms.filter(m => m.stage === stage || (stage === 'W' && m.stage === 'B' && false));
    if (!list.length) return '';
    const rounds = [...new Set(list.map(m => m.round))].sort((a, b) => a - b);
    return `<div class="stage-h label">${title}</div><div class="bracket-wrap"><div class="bracket">${rounds.map(rd => {
      const rm = list.filter(m => m.round === rd).sort((a, b) => a.idx - b.idx);
      return `<div class="bcol"><div class="label">${esc(stage === 'L' ? 'Round ' + rd : KT.matchLabel(rm[0], br))}</div><div class="bcol-in">${rm.map(m => bmHTML(did, m, res, m.id === liveId)).join('')}</div></div>`;
    }).join('')}</div></div>`;
  };
  let html = '';
  if (br.format === 'RR') {
    html += `<div class="grid2">${Object.keys(br.pools || {}).map(P => poolHTML(did, P, liveId)).join('')}</div>`;
    if (ms.some(m => m.stage === 'PO')) html += `<div class="card">${cols('PO', 'Playoff')}${ms.some(m => m.stage === 'B') ? `<div class="stage-h label">Bronze match</div><div class="bcol">${bmHTML(did, br.matches['PO-B'], res, liveId === 'PO-B')}</div>` : ''}</div>`;
  } else {
    html += `<div class="card">${cols('W', br.format === 'DE' ? 'Winners bracket' : 'Bracket')}${br.matches.B ? `<div class="stage-h label">Bronze match</div><div class="bcol">${bmHTML(did, br.matches.B, res, liveId === 'B')}</div>` : ''}</div>`;
    if (br.format === 'DE') {
      if (ms.some(m => m.stage === 'L')) html += `<div class="card">${cols('L', 'Repechage (losers) bracket')}</div>`;
      html += `<div class="card"><div class="stage-h label">Grand final</div><div class="bracket">${['GF', 'GF2'].filter(id => br.matches[id]).map(id => `<div class="bcol"><div class="label">${id === 'GF' ? 'Grand final' : 'Reset (if needed)'}</div>${bmHTML(did, br.matches[id], res, liveId === id)}</div>`).join('')}</div></div>`;
    }
  }
  return html;
}
function poolHTML(did, P, liveId) {
  const br = S.d.brackets[did], res = DC.res[did] || {};
  const st = KT.standings(br, P, id => res[id]);
  const ms = Object.values(br.matches).filter(m => m.stage === 'P' && m.pool === P).sort((a, b) => a.round - b.round || a.idx - b.idx);
  const adv = br.advance || 0;
  return `<div class="card stack"><div class="row between"><h3>Pool ${esc(P)}</h3>${st.complete ? (st.tie ? `<span class="chip warn">Tie</span>` : '<span class="chip ok">Complete</span>') : ''}</div>
    <div class="tw"><table><thead><tr><th>#</th><th>Entrant</th><th class="n">W</th><th class="n">L</th><th class="n">For</th><th class="n">Agst</th></tr></thead><tbody>

/* ---------- results ---------- */
function resultsHTML() {
  const medals = [];
  const rows = DC.divs.filter(d => S.d.brackets[d.id] || divEntrants(d.id).length === 1).map(d => {
    const br = S.d.brackets[d.id];
    const pl = br ? DC.pl[d.id] : { complete: true, gold: divEntrants(d.id)[0], bronze: [] };
    if (pl.complete) {

      if (pl.silver) medals.push({ dojo: entDojo(pl.silver), place: 'silver' });
      (pl.bronze || []).forEach(b => medals.push({ dojo: entDojo(b), place: 'bronze' }));
    }
    const cell = (id, cls, n) => id ? `<div class="pl"><span class="medal ${cls}">${n}</span><span style="min-width:0"><div class="name">${esc(entName(id))}</div><div class="dojo">${esc(entDojo(id))}</div></span></div>` : '';

    return `<div class="card stack"><div class="row between"><div style="min-width:0"><h3>${esc(d.name)}</h3><div class="small muted">${S.d.rings[d.ringId] ? esc(S.d.rings[d.ringId].name) : 'No ring'}</div></div>

      ${pl.complete ? `<div class="podium">${cell(pl.gold, 'g', 1)}${cell(pl.silver, 's', 2)}${(pl.bronze || []).map(b => cell(b, 'b', 3)).join('')}</div>` : `<div class="small muted">${br ? `${bracketState(d.id).fought} of ${bracketState(d.id).playable} ${bracketState(d.id).kp ? 'performances scored' : 'matches fought'}.` : ''}</div>`}

/* ---------- kata score pools view ---------- */
function kpTableHTML(did, title, rows, order, opts) {
  const br = S.d.brackets[did], J = br.judges || 6, can = canScoreDiv(did), k = J >= 5 ? J - 2 : J;
  const f = x => (x / k).toFixed(2);
  const byId = Object.fromEntries(rows.map(r => [r.id, r]));
  const seq = opts.byRank ? rows : order.map(id => byId[id]);
  const sc = (r) => {
    const e = (br.scores || {})[r.key]; if (!e) return '';
    if (e.hansoku) return '<span class="chip bad">Han-soku</span>';
    const v = e.s.map(Number), hi = Math.max(...v), lo = Math.min(...v); let dh = J >= 5, dl = J >= 5;
    return v.map(x => { let cls = ''; if (dh && x === hi) { cls = 'dropped'; dh = false; } else if (dl && x === lo) { cls = 'dropped'; dl = false; } return `<span class="js ${cls}">${x.toFixed(1)}</span>`; }).join('');
  };
  return `<div class="card flush"><div class="card-h"><h3>${esc(title)}</h3>${opts.chip || ''}</div><div class="tw"><table class="kp"><thead><tr><th>#</th><th>${opts.byRank ? 'Place' : 'Order'}</th><th>Competitor</th><th>${br.kataRule ? 'Kata' : 'Notes'}</th><th>Judges</th>${opts.carry ? '<th class="n">Final elim.</th><th class="n">Final</th>' : ''}<th class="n">Score</th></tr></thead><tbody>
    ${seq.map((r, i) => `<tr class="${can ? 'click' : ''} ${r.advance ? 'adv' : ''}" ${can ? `data-act="kp-score" data-did="${esc(did)}" data-key="${esc(r.key)}"` : ''}>
      <td class="num">${i + 1}</td><td class="num">${r.rank ? (opts.medals && r.rank <= 3 ? `<span class="medal ${['g', 's', 'b'][r.rank - 1]}">${r.rank}</span>` : r.rank) : '—'}${r.advance ? ' <span class="chip ok" title="Advances">▸</span>' : ''}</td>
      <td><div class="name">${esc(entName(r.id))}</div><div class="dojo">${esc(entDojo(r.id))}</div></td>
      <td class="small">${esc(r.kata || '')}${r.appTotal != null ? `<div class="tiny muted">Kata ${f(r.kataOwn)} · Application ${f(r.appTotal)}</div>` : ''}${r.rpTotal != null ? `<div class="tiny muted">Kettei-sen ${f(r.rpTotal)}</div>` : ''}</td>
      <td class="jcell">${sc(r)}</td>
      ${opts.carry ? `<td class="n">${r.sheet ? f(r.carry) : ''}</td><td class="n">${r.sheet ? f(r.own) : ''}</td>` : ''}
      <td class="n"><b>${r.sheet ? f(r.total) : ''}</b></td></tr>`).join('')}</tbody></table></div>
    ${opts.needRp && opts.needRp.length ? `<div class="notice warn" style="margin:10px 16px">Tied even after adding back all six scores: ${opts.needRp.map(id => esc(entName(id))).join(', ')} — Kettei-sen${br.kataRule ? ' with a different kata' : ''}.</div>` : ''}</div>`;
}
function kpViewHTML(did) {
  const br = S.d.brackets[did], st = KT.kpState(br);
  let h = `<p class="small muted">ITKF kata system · pools of up to ${br.poolSize || 8} · ${br.judges || 6} judges score 0–10${(br.judges || 6) >= 5 ? ', highest and lowest dropped, average of the rest' : ''} · top 4 of each pool advance until 8 remain · final elimination and final each need a different kata${br.application ? ' · final adds Application (Bunkai)' : ''} · final score = final elimination + final · ties: all six scores added back, then Kettei-sen.</p>`;
  for (const rd of st.rounds) {
    h += `<div class="stage-h label">${esc(KT.kpRoundName(rd))}</div><div class="stack">`;
    for (const P of Object.keys(rd.pools)) {
      const p = rd.pools[P];
      const chip = p.complete ? '<span class="chip ok">Complete</span>' : `<span class="chip plain">${p.rows.filter(r => r.sheet).length}/${p.rows.length} scored</span>`;
      h += kpTableHTML(did, `${Object.keys(rd.pools).length > 1 ? 'Pool ' + P : KT.kpRoundName(rd)}`, p.rows, p.order, { byRank: p.scoredAll, chip, needRp: p.needRp });
    }
    h += '</div>';
  }
  if (st.final) {
    const f = st.final;
    h += `<div class="stage-h label">Final</div>` + kpTableHTML(did, 'Final', f.rows, f.order, { byRank: f.rows.every(r => r.sheet), carry: f.carried, medals: f.complete,
      chip: f.complete ? '<span class="chip ok">Complete</span>' : `<span class="chip plain">${f.rows.filter(r => r.sheet).length}/${f.rows.length} scored</span>`, needRp: f.needRp });
  }
  return h;
}

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const EV_ALIASES = { 'individual kata': 'IKATA', kata: 'IKATA', ikata: 'IKATA', 'individual kumite': 'IKUMITE', kumite: 'IKUMITE', ikumite: 'IKUMITE', 'team kata': 'TKATA', tkata: 'TKATA',
  'team kumite': 'TKUMITE', tkumite: 'TKUMITE', fukugo: 'FUKUGO', fukogo: 'FUKUGO', enbu: 'ENBU' };
function importRows(text) {
  const rows = parseCSV(text); if (rows.length < 2) return { recs: [], errors: ['Need a heading row and at least one competitor.'] };
  const h = rows[0].map(x => x.toLowerCase().replace(/[^a-z]/g, ''));
  const col = (...names) => h.findIndex(x => names.includes(x));
  const ix = { first: col('firstname', 'first', 'givenname'), last: col('lastname', 'last', 'surname', 'familyname'), gender: col('gender', 'sex'), dob: col('dob', 'dateofbirth', 'birthdate', 'birthday'),
    rank: col('rank', 'belt', 'grade'), dojo: col('dojo', 'club', 'school'), state: col('state', 'region', 'province'), country: col('country'), email: col('email'), phone: col('phone', 'mobile'),
    en: col('emergencyname', 'emergencycontact', 'emergency'), ep: col('emergencyphone'), waiver: col('waiver', 'waiversigned'), paid: col('paid', 'feepaid'), events: col('events', 'event', 'divisions') };
  const recs = [], errors = [];
  const g = (r, i) => (i >= 0 ? (r[i] || '').trim() : '');
  const yes = s => /^(y|yes|true|1|x|✓)$/i.test(s);
  rows.slice(1).forEach((r, n) => {
    let dob = g(r, ix.dob);
    const m = dob.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) dob = `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
    const gs = g(r, ix.gender).toLowerCase();
    const rec = { firstName: g(r, ix.first), lastName: g(r, ix.last), gender: /^(m|male|man|men)$/.test(gs) ? 'M' : /^(f|female|w|woman|women)$/.test(gs) ? 'F' : '',
      dob: /^\d{4}-\d{2}-\d{2}$/.test(dob) ? dob : '', rank: parseRank(g(r, ix.rank)), dojo: g(r, ix.dojo), state: g(r, ix.state), country: g(r, ix.country), email: g(r, ix.email), phone: g(r, ix.phone),
      emergencyName: g(r, ix.en), emergencyPhone: g(r, ix.ep), waiver: yes(g(r, ix.waiver)), feePaid: yes(g(r, ix.paid)),
      events: [...new Set(g(r, ix.events).split(/[;|]/).map(s => EV_ALIASES[s.trim().toLowerCase()] || (KT.EVENT_TYPES[s.trim().toUpperCase()] ? s.trim().toUpperCase() : null)).filter(Boolean))] };
    const miss = [];
    if (!rec.firstName || !rec.lastName) miss.push('name'); if (!rec.rank) miss.push('rank');
    if (curEvent().kind === 'tournament') { if (!rec.gender) miss.push('gender'); if (!rec.dob) miss.push('date of birth'); }
    if (miss.length) errors.push(`Row ${n + 2}: missing ${miss.join(', ')}`); else recs.push(rec);
  });
  return { recs, errors };
}

  'imp-preview': () => { const { recs, errors } = importRows($('#imp-text').value); $('#imp-preview').innerHTML = `${plural(recs.length, 'competitor')} ready to import.${errors.length ? '<br>' + errors.slice(0, 8).map(esc).join('<br>') + (errors.length > 8 ? '<br>…' : '') : ''}`; },
  'imp-run': () => runImport(),
  'export-comps': () => {
    const dir = isDirector();
    const rows = [['first_name', 'last_name', 'gender', 'dob', 'age', 'rank', 'dojo', 'state', 'country', 'email', 'phone', 'emergency_name', 'emergency_phone', 'waiver', 'paid', 'checked_in', 'status', 'events']];
    for (const c of DC.comps) rows.push([c.firstName, c.lastName, c.gender, dir ? c.dob : '', KT.ageOf(c, DC.asOf), KT.rankLabel(c.rank), c.dojo, c.state, c.country, dir ? c.email : '', dir ? c.phone : '', dir ? c.emergencyName : '', dir ? c.emergencyPhone : '', c.waiver ? 'yes' : 'no', c.feePaid ? 'yes' : 'no', c.checkedIn ? 'yes' : 'no', c.status, (c.events || []).map(e => KT.EVENT_TYPES[e] ? KT.EVENT_TYPES[e].label : e).join('; ')]);
    saveFile(`${curEvent().name} - competitors.csv`, KT.toCSV(rows));
  },
  'export-results': () => {
    const rows = [['division', 'place', 'name', 'dojo']];
    for (const d of DC.divs) {
      const br = S.d.brackets[d.id]; const pl = br ? DC.pl[d.id] : (divEntrants(d.id).length === 1 ? { complete: true, gold: divEntrants(d.id)[0], bronze: [] } : null);
      if (!pl || !pl.complete) continue;
      if (pl.gold) rows.push([d.name, 1, entName(pl.gold), entDojo(pl.gold)]);
      if (pl.silver) rows.push([d.name, 2, entName(pl.silver), entDojo(pl.silver)]);
      (pl.bronze || []).forEach(b => rows.push([d.name, 3, entName(b), entDojo(b)]));
    }
    saveFile(`${curEvent().name} - results.csv`, KT.toCSV(rows));
  },
  'team-new': el => teamForm(null, el.dataset.et),
  'team-edit': el => teamForm(el.dataset.id),
  'team-delete': async () => { const id = $('#f-team').dataset.id; if (!(await confirmBox('Delete this team?', 'Delete', true))) return; closeModal(); guard(() => S.store.del(P.doc(S.evId, 'teams', id)), 'Team deleted'); },
  'div-std': () => stdDivForm(false),
  'div-kyu': () => stdDivForm(true),
  'div-new': () => divForm(null),
  'div-edit': el => divForm(el.dataset.id),
  'div-delete': async () => {
    const id = $('#f-div').dataset.id; const bs = bracketState(id);
    if (!(await confirmBox(bs.drawn ? 'Delete this division and its bracket and results?' : 'Delete this division?', 'Delete', true))) return;
    closeModal(); await guard(async () => { if (bs.drawn) await S.store.del(P.live(S.evId, 'brackets', id)); await S.store.del(P.doc(S.evId, 'divisions', id)); }, 'Division deleted');
  },
  'bracket-clear': async () => {
    const id = $('#f-div').dataset.id; const bs = bracketState(id);
    if (!(await confirmBox(bs.results ? 'Clear this bracket and ALL recorded results?' : 'Clear this bracket?', 'Clear bracket', true))) return;
    await guard(() => S.store.del(P.live(S.evId, 'brackets', id)), 'Bracket cleared'); closeModal();
  },
  draw: async el => {
    const form = $('#f-div');
    if (form && form.dataset.id === el.dataset.id) { const id = await saveDiv(form, true); if (!id) return; setTimeout(() => drawDivision(id), 50); return; }
    drawDivision(el.dataset.id);
  },
  'draw-all': () => drawAll(),
  'view-bracket': el => { S.ui.bracketDiv = el.dataset.id; S.ui.tab = 'brackets'; render(); },
  'ring-new': () => ringForm(null),
  'ring-edit': el => ringForm(el.dataset.id),
  'ring-delete': async () => {
    const id = $('#f-ring').dataset.id;
    if (!(await confirmBox('Delete this ring? Its divisions become unassigned.', 'Delete', true))) return;
    closeModal();
    for (const d of DC.divs.filter(x => x.ringId === id)) await guard(() => S.store.update(P.doc(S.evId, 'divisions', d.id), { ringId: '' }));
    guard(() => S.store.del(P.doc(S.evId, 'rings', id)), 'Ring deleted');
  },
  'ring-move': async el => {
    const d = DC.divBy[el.dataset.id]; const list = DC.divs.filter(x => x.ringId === d.ringId).sort((a, b) => (a.ringOrder || 0) - (b.ringOrder || 0));
    const i = list.indexOf(d), j = i + (+el.dataset.dir); if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    for (let k = 0; k < list.length; k++) if ((list[k].ringOrder || 0) !== k) await guard(() => S.store.update(P.doc(S.evId, 'divisions', list[k].id), { ringOrder: k }));
  },
  'ring-undiv': el => guard(() => S.store.update(P.doc(S.evId, 'divisions', el.dataset.id), { ringId: '' })),
  'ring-manage': el => { const r = S.d.rings[el.dataset.ring]; const ids = [...new Set((r.managerIds || []).concat(el.dataset.uid))]; $$('.dd-list').forEach(x => { x.hidden = true; }); guard(() => S.store.update(P.doc(S.evId, 'rings', r.id), { managerIds: ids }), 'Manager added'); },
  'ring-unmanage': el => { const r = S.d.rings[el.dataset.id]; guard(() => S.store.update(P.doc(S.evId, 'rings', r.id), { managerIds: (r.managerIds || []).filter(x => x !== el.dataset.uid) })); },
  'staff-add': el => { const ev = curEvent(); $$('.dd-list').forEach(x => { x.hidden = true; }); guard(() => S.store.update(P.event(ev.id), { staffIds: [...new Set((ev.staffIds || []).concat(el.dataset.uid))] }), 'Staff added'); },
  'staff-remove': el => { const ev = curEvent(); guard(() => S.store.update(P.event(ev.id), { staffIds: (ev.staffIds || []).filter(x => x !== el.dataset.uid) })); },
  'session-new': () => sessionForm(null),
  'session-edit': el => sessionForm(el.dataset.id),
  'session-delete': async () => { const id = $('#f-sess').dataset.id; if (!(await confirmBox('Delete this session and its attendance?', 'Delete', true))) return; closeModal(); await guard(async () => { await S.store.del(P.doc(S.evId, 'sessions', id)); await S.store.del(P.live(S.evId, 'attendance', id)); }, 'Session deleted'); },
  'att-all': async () => { const sid = S.ui.session, present = {}; DC.comps.filter(c => c.status !== 'withdrawn').forEach(c => { present[c.id] = true; }); await writeAttendance(sid, present); },
  tiebreak: el => tiebreakForm(el.dataset.did, el.dataset.pool),
  'tb-move': el => { const i = +el.dataset.i, j = i + (+el.dataset.dir); [S.tbOrder[i], S.tbOrder[j]] = [S.tbOrder[j], S.tbOrder[i]]; $('#tb-body').innerHTML = S.tbDraw(); },
  'tb-save': async () => { const M = S.modal; const ok = await guard(() => S.store.update(P.live(S.evId, 'brackets', M.did), { tiebreak: { [M.P]: S.tbOrder.slice() } }), 'Order saved'); if (ok) closeModal(); },
  /* scoring */
  score: el => openScore(el.dataset.did, el.dataset.mid),
  flag: el => { const d = loadDraft(S.modal.key), f = el.dataset.f; d[f] = d[f] || []; const i = +el.dataset.i; d[f][i] = d[f][i] === el.dataset.s ? null : el.dataset.s; draftChanged(); },
  kiken: el => { const d = loadDraft(S.modal.key); d.kiken = d.kiken === el.dataset.s ? null : el.dataset.s; draftChanged(); },
  'k-ev': el => {
    const M = S.modal, d = loadDraft(M.key), dv = DC.divBy[M.did], sc = scoringOf(dv);
    const log = logAt(d, el.dataset.p);
    const ev = { t: el.dataset.t }; if (el.dataset.s) ev.s = el.dataset.s;
    const o = { kettei: sc.ketteiTime > 0, allowDraw: el.dataset.p.startsWith('bouts'), ketteiOnly: el.dataset.p === 'daihyo' };
    const E = kumiteStyle(dv) === 'kogo' && el.dataset.p !== 'daihyo' ? KT.kogoEval : KT.kumiteEval;
    const before = E(log, o).phase;
    log.push(ev);
    const after = E(log, o);
    if (E === KT.kumiteEval && before !== 'kettei' && after.phase === 'kettei') setClock(sc.ketteiTime);
    if (after.done) stopClock();
    draftChanged();
  },
  'k-undo': el => { const M = S.modal, d = loadDraft(M.key); logAt(d, el.dataset.p).pop(); draftChanged(); },
  clock: () => toggleClock(),
  'clock-reset': el => { const M = S.modal, d = loadDraft(M.key), sc = scoringOf(DC.divBy[M.did]); const ph = KT.kumiteEval(logAt(d, el.dataset.p), { kettei: sc.ketteiTime > 0, ketteiOnly: el.dataset.p === 'daihyo' }).phase; setClock(ph === 'kettei' ? sc.ketteiTime : sc.boutTime); },
  'tie-side': el => { const d = loadDraft(S.modal.key); d.tieSide = d.tieSide === el.dataset.s ? null : el.dataset.s; draftChanged(); },
  'bout-sel': el => { S.boutSel = +el.dataset.i; const sc = scoringOf(DC.divBy[S.modal.did]); setClock(+el.dataset.i >= sc.bouts ? sc.ketteiTime : sc.boutTime); renderScore(true); },
  'fk-hantei': el => { const d = loadDraft(S.modal.key); d.hantei = el.dataset.s; draftChanged(); },
  'reset-draft': async () => { if (!(await confirmBox('Clear everything entered on this scoresheet?', 'Clear'))) return; const M = S.modal; dropDraft(M.key); S.boutSel = 0; setClock(scoringOf(DC.divBy[M.did]).boutTime); renderScore(true); pushLive(); },
  'call-mat': () => { pushLive(); toast('Called to the mat'); },
  'save-result': () => saveResult(),
  'kp-score': el => openKP(el.dataset.did, el.dataset.key),
  'kp-save': () => kpSave(),
  'kp-call': () => { kpPushLive(false); toast('Called to the mat'); },
  'kp-clear': async () => {
    const M = S.modal; if (!(await confirmBox(`Clear this score for ${entName(M.ctx.id)}?`, 'Clear score', true))) return;
    const ok = await guard(() => S.store.update(P.live(S.evId, 'brackets', M.did), { scores: { [M.key]: null } }), 'Score cleared'); if (ok) { dropDraft(M.dkey); closeModal(); }
  },
  'undo-result': async () => {
    const M = S.modal; const br = S.d.brackets[M.did];
    if (!KT.canEdit(br, M.mid, DC.res[M.did])) return;
    if (!(await confirmBox('Undo this result? The match returns to “ready”.', 'Undo result', true))) return;
    const ok = await guard(() => S.store.update(P.live(S.evId, 'brackets', M.did), { results: { [M.mid]: null } }), 'Result undone');
    if (ok) closeModal();
  },
};
const CHANGE = {
  'sim-role': el => { S.ui.simRole = el.value; saveUIPrefs(); closeModal(); render(); },
  'sim-ring': el => { S.ui.simRing = el.value; saveUIPrefs(); render(); },
  filter: el => { S.ui.filter = el.value; render(); },
  divFilter: el => { S.ui.divFilter = el.value; render(); },
  ring: el => { S.ui.ring = el.value; render(); },
  bracketDiv: el => { S.ui.bracketDiv = el.value; render(); },
  session: el => { S.ui.session = el.value; render(); },
  'ev-kind': el => { $$('.ev-t').forEach(x => { x.hidden = el.value !== 'tournament'; }); },
  'div-et': el => { const g = $('#d-g'); const cur = g.value; g.innerHTML = KT.EVENT_TYPES[el.value].genders.map(x => opt(x, KT.GENDERS[x], cur)).join(''); },
  'ring-adddiv': el => { if (!el.value) return; const rid = el.dataset.ring; const n = DC.divs.filter(d => d.ringId === rid).length; guard(() => S.store.update(P.doc(S.evId, 'divisions', el.value), { ringId: rid, ringOrder: n })); },
  'ring-format': async el => {
    const f = el.value; if (!f) return;
    const list = DC.divs.filter(d => d.ringId === el.dataset.ring);
    let n = 0, skipped = 0;
    for (const d of list) {
      if (bracketState(d.id).drawn) { skipped++; continue; }
      if (f === 'KP' && kindOf(d) !== 'kata') { skipped++; continue; }
      if (d.format !== f) { const up = { format: f }; if (f === 'KP') up.scoring = Object.assign({}, scoringOf(d), { method: 'scores', judges: Math.max(5, scoringOf(d).judges) }); await guard(() => S.store.update(P.doc(S.evId, 'divisions', d.id), up)); n++; }
    }
    toast(`${KT.FORMATS[f]} set on ${plural(n, 'division')}${skipped ? ` · ${skipped} skipped (already drawn${f === 'KP' ? ' or not kata' : ''})` : ''}`);
  },
  'fb-role': el => guard(() => el.checked ? FB.fs.doc('roles/' + el.dataset.uid).set({ role: 'director', at: new Date().toISOString() }) : FB.fs.doc('roles/' + el.dataset.uid).delete(), 'Access updated'),
  'kp-hansoku': el => { const d = loadDraft(S.modal.dkey); d.hansoku = el.checked; saveDraft(S.modal.dkey); kpPaint(); },
  awarded: el => guard(() => S.store.update(P.live(S.evId, 'brackets', el.dataset.did), { awarded: el.checked })),
  att: el => writeAttendance(S.ui.session, { [el.dataset.id]: el.checked }),
  'imp-file': el => { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#imp-text').value = rd.result; ACT['imp-preview'](); }; rd.readAsText(f); },
  kscore: el => { const d = loadDraft(S.modal.key), k = el.dataset.s === 'a' ? 'sa' : 'sb'; d[k] = d[k] || []; const v = el.value.replace(',', '.'); d[k][+el.dataset.i] = v === '' ? '' : v; draftChanged(); },
  'bout-member': el => { const d = loadDraft(S.modal.key); const i = el.dataset.i; let b; if (i === 'd') { d.daihyo = d.daihyo || { log: [] }; b = d.daihyo; } else { d.bouts = d.bouts || []; d.bouts[+i] = d.bouts[+i] || { log: [] }; b = d.bouts[+i]; } b[el.dataset.s === 'a' ? 'ma' : 'mb'] = el.value; draftChanged(); },
};
async function writeAttendance(sid, present) {
  const path = P.live(S.evId, 'attendance', sid);
  if (S.d.attendance[sid]) await guard(() => S.store.update(path, { present }));
  else await guard(() => S.store.set(path, { present }));
}
let searchT = null;
const INPUT = {
  q: el => { S.ui.q = el.value; render(); },
  'kp-j': el => { const d = loadDraft(S.modal.dkey), f = el.dataset.f || 's'; d[f] = d[f] || []; d[f][+el.dataset.i] = el.value; saveDraft(S.modal.dkey); kpPaint(); },
  'kp-kata': el => { const d = loadDraft(S.modal.dkey); d.kata = el.value; saveDraft(S.modal.dkey); kpPaint(); },
  'mgr-search': el => personSearch(el, $('#mgr-dd-' + el.dataset.ring), id => `data-act="ring-manage" data-ring="${esc(el.dataset.ring)}" data-uid="${esc(id)}"`),
  'staff-search': el => personSearch(el, $('#staff-dd'), id => `data-act="staff-add" data-uid="${esc(id)}"`),
};
function personSearch(input, dd, attrs) {
  if (!S.user) return;
  clearTimeout(searchT);
  searchT = setTimeout(async () => {
    const hits = await S.user.search(input.value);
    hits.forEach(h => { S.profiles[h.id] = h; });
    dd.innerHTML = hits.length ? hits.map(h => `<button type="button" ${attrs(h.id)}><img src="${esc(h.avatarUrl)}" alt="" width="20" height="20" style="border-radius:50%"> ${esc(h.name)}${h.email ? ` <span class="muted small">${esc(h.email)}</span>` : ''}</button>`).join('')
      : `<div class="small muted" style="padding:10px">No people found. They need access to this page first — share it with them from claude.ai, then search again.</div>`;
    dd.hidden = false;
  }, 120);
}

function wire() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!e.target.closest('.dd')) $$('.dd-list').forEach(x => { x.hidden = true; });
    if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'A') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#confirm').hidden) confirmDone(false); else if (!$('#modal').hidden) closeModal(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.bm[role="button"]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el, e); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-input$="-search"]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el, e); });
  document.addEventListener('submit', async e => {
    const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
    const k = f.dataset.form;
    if (k === 'event') {
      const v = fd(f), id = f.dataset.id || uid(), old = S.events[f.dataset.id] || {};
      if (!v.name || !v.startDate) { toast('Name and start date are required.', true); return; }
      if (v.kind === 'tournament' && !(v.eventTypes || []).length) { toast('Pick at least one event.', true); return; }
      const ev = Object.assign({}, old, v, { id: undefined, staffIds: old.staffIds || [], createdAt: old.createdAt || new Date().toISOString() }); delete ev.id;
      const ok = await guard(() => S.store.set(P.event(id), ev), f.dataset.id ? 'Event saved' : 'Event created');
      if (!ok) return;
      closeModal();
      if (!f.dataset.id) openEvent(id);
      else {
        const asOf = v.ageAsOf || v.startDate, oldAsOf = old.ageAsOf || old.startDate;
        if (asOf !== oldAsOf) for (const c of DC.comps) if (c.dob) await guard(() => S.store.update(P.doc(id, 'competitors', c.id), { age: KT.ageOn(c.dob, asOf) }));
      }
    }
    else if (k === 'comp') saveComp(f);
    else if (k === 'team') saveTeam(f);
    else if (k === 'div') saveDiv(f);
    else if (k === 'std') saveStd(f, false);
    else if (k === 'kyu') saveStd(f, true);
    else if (k === 'ring') {
      const v = fd(f); if (!v.name) return;
      const id = f.dataset.id; const ok = await guard(() => id ? S.store.update(P.doc(S.evId, 'rings', id), { name: v.name }) : S.store.set(P.doc(S.evId, 'rings', uid()), { name: v.name, order: DC.rings.length + 1, managerIds: [] }), 'Ring saved');
      if (ok) closeModal();
    }
    else if (k === 'session') {
      const v = fd(f); if (!v.title || !v.date) { toast('Title and date are required.', true); return; }
      const ok = await guard(() => S.store.set(P.doc(S.evId, 'sessions', f.dataset.id || uid()), v), 'Session saved'); if (ok) closeModal();
    }
  });
}

async function init() {
  readUIPrefs();
  wire();
  render();
  if (window.KT_FIREBASE_CONFIG && window.firebase) {
    try { if (!(await initFirebase(window.KT_FIREBASE_CONFIG))) return; }
    catch (e) { console.error(e); S.store = LocalStore(); toast('Could not reach Firebase. Working in local mode.', true); }
    subscribeEvents(); render(); return;
  }
  let db = null, user = null;
  const cl = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
  if (cl) {
    try { [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); } catch (e) { db = null; }
    cl.use('downloads').then(x => { S.downloads = x; }).catch(() => {});
  }
  if (db) {
    S.store = CloudStore(db); S.user = user;
    if (user) {
      try {
        const [me, canEd, canW] = await Promise.all([user.me(), user.canEdit(), user.can('data.write')]);
        S.myId = me.id; S.isDirector = !!canEd; S.canWrite = canW;
        if (canW === false && !canEd) S.readOnly = true;
      } catch (e) { /* reads never reject */ }
    }
  } else {
    S.store = LocalStore();
  }
  subscribeEvents();
  render();
}
init();
})();
</script>
