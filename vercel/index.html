<title>Karate Event Tracker</title>
<meta name="description" content="Karate tournament and camp manager: divisions, brackets, WTKF scoring, rings, results.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
:root { --sat: env(safe-area-inset-top, 0px); }
/* Layout: app bar + scrollable tab strip + single content column (max 1200px); modal sheets slide up on phones. */
:root {
  --paper: #f2f3ee;      /* tatami-grey ground */
  --panel: #ffffff;
  --ink: #17191f;
  --ink-2: #33373f;      /* v1.18: darker secondary text */
  --ink-3: #50555e;
  --line: #d9dbd3;
  --line-2: #c6c9bf;
  --ai: #213f73;         /* aizome indigo accent */
  --ai-soft: #e3e9f4;
  --aka: #c21a2c;        /* Aka corner */
  --aka-soft: #fbe4e6;
  --aka-bg: #c21a2c;     /* Aka corner fill, white text */
  --go: #0b7a5c;         /* actionable: score / tap to act */
  --go-soft: #dcf2ea;
  --go-ink: #ffffff;
  --shiro: #ffffff;      /* Shiro corner */
  --shiro-ink: #17191f;
  --gold: #b88a13; --silver: #7d8591; --bronze: #9b5a2a;
  --ok: #2c7a4b; --ok-soft: #e0f1e6;
  --warn: #9a6a00; --warn-soft: #fbf0d4;
  --bad: #b3261e; --bad-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(20,24,35,.06), 0 8px 24px rgba(20,24,35,.08);
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* plain (undotted) zero for scores */
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121419; --panel: #1b1e25; --ink: #eceef2; --ink-2: #d3d7de; --ink-3: #aeb3bd;
  --line: #2c3039; --line-2: #3a3f4a; --ai: #8fb0ea; --ai-soft: #1f2a3f;
  --aka: #ff5a67; --aka-soft: #3a1a1e; --aka-bg: #a51c2b; --go: #3ccf9a; --go-soft: #123a2e; --go-ink: #06241a; --shiro: #eef0f4; --shiro-ink: #121419;
  --gold: #e0b43c; --silver: #aab2bf; --bronze: #d08a55;
  --ok: #6fcf97; --ok-soft: #173024; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8a80; --bad-soft: #3a1b19;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121419; --panel: #1b1e25; --ink: #eceef2; --ink-2: #d3d7de; --ink-3: #aeb3bd;
  --line: #2c3039; --line-2: #3a3f4a; --ai: #8fb0ea; --ai-soft: #1f2a3f;
  --aka: #ff5a67; --aka-soft: #3a1a1e; --aka-bg: #a51c2b; --go: #3ccf9a; --go-soft: #123a2e; --go-ink: #06241a; --shiro: #eef0f4; --shiro-ink: #121419;
  --gold: #e0b43c; --silver: #aab2bf; --bronze: #d08a55;
  --ok: #6fcf97; --ok-soft: #173024; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8a80; --bad-soft: #3a1b19;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html { font-size: 112.5%; }   /* v1.18: every rem-based size one step larger */
body { background: var(--paper); color: var(--ink); font: 17px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 1.55rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; }
p { margin: 0; }
a { color: var(--ai); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-size: .82rem; } .tiny { font-size: .74rem; }
.label { font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* app bar */
.bar { position: sticky; top: 0; padding-top: var(--sat); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 20; background: var(--ink); color: #fff; }
:root[data-theme="dark"] .bar { background: #0b0c10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar { background: #0b0c10; } }
.bar-in { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; color: inherit; padding: 0; font: inherit; }
.brand .mark { width: 30px; height: 30px; border-radius: 50%; background: #fff; position: relative; flex: none; }
.brand .mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #c21a2c; }
.brand > span { text-align: left; }
.brand b { font-family: var(--f-display); font-size: 1.02rem; letter-spacing: .02em; }
.brand small { display: block; font-size: .7rem; opacity: .8; letter-spacing: .08em; text-transform: uppercase; }
.bar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--ai-soft); color: var(--ai); white-space: nowrap; }
.bar .chip { background: rgba(255,255,255,.12); color: #fff; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.aka { background: var(--aka-soft); color: var(--aka); }
.chip.plain { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.bar select { width: auto; max-width: 220px; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.bar select option { color: #000; }

/* tabs */
.tabs { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: var(--barh, 52px); z-index: 15; }
.tabs-in { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 12px 10px; font: 600 .88rem var(--f-body); color: var(--ink-2); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--aka); }
.tab:focus-visible { outline: 2px solid var(--ai); outline-offset: -2px; }

main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 14px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.section-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font: 600 1.6rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--ai); }

/* buttons & inputs */
button, .btn { font: 600 .86rem var(--f-body); border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); padding: 8px 13px; cursor: pointer; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
button:hover { border-color: var(--ink-3); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ai); outline-offset: 1px; }
button.primary { background: var(--ai); border-color: var(--ai); color: #fff; }
:root[data-theme="dark"] button.primary { color: #0e1422; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0e1422; } }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
button.ghost { border-color: transparent; background: transparent; }
button.sm { min-height: 30px; padding: 4px 9px; font-size: .8rem; }
button:disabled { opacity: .45; cursor: not-allowed; }
label.f { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--ink-2); min-width: 0; }
label.f.req > span::after { content: " *"; color: var(--aka); }
input, select, textarea { font: .92rem var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; accent-color: var(--ai); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: .88rem; cursor: pointer; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.fgrid .span { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin: 0; min-width: 0; }
legend { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 0 6px; }
.search { max-width: 280px; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } @media (hover: hover) { tr.click:hover td { background: var(--ai-soft); } }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* empty */
.empty { text-align: center; padding: 36px 16px; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty .mark-lg { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--line-2); position: relative; }
.empty .mark-lg::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: var(--aka); opacity: .8; }
.notice { border-radius: var(--r); padding: 10px 14px; font-size: .88rem; display: flex; gap: 10px; align-items: flex-start; }
.notice.warn { background: var(--warn-soft); color: var(--warn); } .notice.info { background: var(--ai-soft); color: var(--ai); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }

/* event cards */
.ev-card { text-align: left; display: grid; gap: 8px; align-content: start; cursor: pointer; width: 100%; font-weight: 400; justify-content: stretch; }
.ev-card:hover { border-color: var(--ai); }
.ev-card .date { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-2); }

/* aka / shiro */
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.belt { width: 5px; height: 22px; border-radius: 2px; flex: none; border: 1px solid var(--line-2); }
.belt.a { background: var(--aka); border-color: var(--aka); } .belt.b { background: var(--shiro); border-color: var(--ink-3); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dojo { font-size: .76rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* brackets */
.bracket-wrap { overflow-x: auto; padding-bottom: 6px; }
.bracket { display: flex; gap: 22px; min-width: min-content; align-items: stretch; padding: 4px 2px; }
.bcol { display: flex; flex-direction: column; gap: 8px; min-width: 210px; width: 210px; }
.bcol-in { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
.bcol > .label { text-align: center; margin-bottom: 2px; }
.bm { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; cursor: default; position: relative; font-size: .84rem; }
.bm.click { cursor: pointer; } @media (hover: hover) { .bm.click:hover { border-color: var(--ai); box-shadow: var(--shadow); } }
.bm.ready { border-color: var(--ai); } .bm.live { border-color: var(--aka); box-shadow: 0 0 0 2px var(--aka-soft); }
.bm .ln { display: grid; grid-template-columns: 6px 1fr auto; gap: 8px; align-items: center; padding: 6px 9px 6px 0; min-height: 32px; }
.bm .ln + .ln { border-top: 1px solid var(--line); }
.bm .ln .strip { align-self: stretch; }
.bm .ln.a .strip { background: var(--aka); } .bm .ln.b .strip { background: var(--line-2); }
.bm .ln.win .name { color: var(--ink); } .bm .ln.lose .name { color: var(--ink-3); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--line-2); }
.bm .ln .sc { font: 600 .8rem var(--f-mono); color: var(--ink-2); }
.bm .ln.tbd .name { color: var(--ink-3); font-weight: 500; font-style: italic; }
.bm .meta { font-size: .68rem; color: var(--ink-3); padding: 3px 9px; background: var(--paper); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; }
.stage-h { margin: 6px 0 8px; }

/* medals */
.medal { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 .72rem var(--f-mono); color: #fff; flex: none; }
.medal.g { background: var(--gold); } .medal.s { background: var(--silver); } .medal.b { background: var(--bronze); }
.podium { display: grid; gap: 6px; }
.podium .pl { display: flex; gap: 10px; align-items: center; min-width: 0; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(12,14,20,.5); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--panel); border-radius: 14px; width: min(760px, 100%); max-height: calc(100% - 20px); overflow: auto; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr auto; }
.sheet.wide { width: min(1000px, 100%); }
.sheet-h { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sheet-b { padding: 16px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.sheet-f { position: sticky; bottom: 0; background: var(--panel); padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 640px) { .scrim { padding: var(--sat) 0 0; place-items: end stretch; } .sheet { border-radius: 14px 14px 0 0; max-height: 94%; width: 100%; } }
#confirm .sheet { width: min(420px, 100%); }

/* scoreboard */
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 230px) minmax(0, 1fr); gap: 10px; align-items: stretch; }
@media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .corner { padding: 8px; } .corner button { padding: 6px 4px; font-size: .74rem; } .corner .big { font-size: 2.4rem; } .board .mid { grid-column: 1 / -1; order: -1; } }
.corner { border-radius: 12px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.corner.a { background: var(--aka-bg); color: #fff; }
.corner.b { background: var(--shiro); color: var(--shiro-ink); border: 2px solid var(--line-2); }
.corner .who { font-weight: 700; font-family: var(--f-display); font-size: 1.02rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.corner .big { font: 700 3.2rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.corner .tally { font: 600 .78rem var(--f-mono); opacity: .85; }
.corner .btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.corner button { min-width: 0; overflow-wrap: anywhere; }
.corner button { min-height: 42px; font-size: .82rem; background: rgba(255,255,255,.14); color: inherit; border-color: rgba(255,255,255,.4); }
.corner.b button { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.22); color: var(--shiro-ink); }
.corner button.pen { font-weight: 500; }
.mid { display: grid; gap: 8px; align-content: start; justify-items: stretch; min-width: 150px; }
.clock { font: 700 2.3rem/1 var(--f-mono); font-variant-numeric: tabular-nums; text-align: center; padding: 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); }
.clock.zero { color: var(--aka); }
.phase { text-align: center; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ai); }
.log { font: .74rem var(--f-mono); color: var(--ink-3); max-height: 90px; overflow: auto; }
.judges { display: grid; gap: 8px; }
.jrow { display: grid; grid-template-columns: 48px 1fr 1fr; gap: 6px; align-items: center; }
.jrow button.on.a { background: var(--aka-bg); color: #fff; border-color: var(--aka-bg); }
.jrow button.on.b { background: var(--shiro); color: var(--shiro-ink); border: 2px solid var(--ink); }
.srow { display: grid; grid-template-columns: 90px repeat(var(--j, 5), minmax(52px, 1fr)) 80px; gap: 6px; align-items: center; }
.srow input { text-align: center; font-family: var(--f-mono); padding: 6px 2px; }
.srow .tot { font: 700 1.05rem var(--f-mono); text-align: right; }
.result-banner { border-radius: 10px; padding: 12px 14px; background: var(--ok-soft); color: var(--ok); font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bout { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 10px; }
.bout-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ring board */
.ring-card .now { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.ring-card .now .sc { font: 700 1.6rem var(--f-mono); padding: 0 6px; }
.queue { display: grid; gap: 4px; }
.queue .q { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; font-size: .84rem; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.queue .q .vs { font-size: .7rem; color: var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: .88rem; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
.pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px 3px 3px; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; }
.person img { width: 22px; height: 22px; border-radius: 50%; }
.dd { position: relative; }
.dd-list { position: absolute; left: 0; right: 0; top: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); z-index: 5; max-height: 240px; overflow: auto; }
.dd-list button { width: 100%; justify-content: flex-start; border: 0; border-radius: 0; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(12px); opacity: .6; } } }

/* kata score pools */
table.kp tr.adv td { background: color-mix(in srgb, var(--ok-soft) 55%, transparent); }
.jcell { white-space: nowrap; }
.js { display: inline-block; min-width: 2.6em; text-align: center; font: 500 .8rem var(--f-mono); color: var(--ink-2); }
.js.dropped { color: var(--ink-3); text-decoration: line-through; }
.kprow { display: grid; grid-template-columns: repeat(var(--j, 6), minmax(56px, 1fr)); gap: 6px; }
.kprow input { text-align: center; font-family: var(--f-mono); }
.kp-total { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.kp-total b { font: 700 2rem var(--f-mono); }

/* recorded result detail */
details.rec { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
details.rec summary { cursor: pointer; font-weight: 700; }
.rec-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rec-flag { font-size: .78rem; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2); }
.rec-flag.a { background: var(--aka-bg); color: #fff; border-color: var(--aka-bg); }
.rec-flag.b { background: var(--shiro); color: var(--shiro-ink); }
.rec-log td { padding: 5px 10px; font-size: .84rem; }
.rec-sep td { background: var(--paper); font-size: .74rem; font-weight: 700; letter-spacing: .04em; color: var(--ink-2); }

/* ===== v1.4 native-app layer: action colors, touch, bottom navigation ===== */
/* Color language: indigo = navigate / secondary action, filled indigo = primary action,
   green = score now (tap to act on a match/performance), red tint = destructive, plain white = information only. */
* { -webkit-tap-highlight-color: transparent; }
button, .bn, .menu-item, .fab { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { background: var(--ai-soft); border-color: transparent; color: var(--ai); }
button:hover { border-color: color-mix(in srgb, var(--ai) 40%, transparent); }
button.primary { background: var(--ai); color: #fff; }
button.ghost { background: transparent; color: var(--ink-2); }
button.danger { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
button.go { background: var(--go); color: var(--go-ink); border-color: var(--go); font-weight: 700; }
button:active:not(:disabled), .click:active, .bn:active, .menu-item:active, .fab:active { transform: scale(.97); }
@media (prefers-reduced-motion: no-preference) { button, .click, .bn, .fab { transition: transform .08s ease, background-color .15s ease; } }
.tab { background: transparent; color: var(--ink-2); }
.brand, .back-btn { background: transparent; }
.corner button { background: rgba(255,255,255,.16); color: inherit; }
.corner.b button { background: rgba(0,0,0,.06); color: var(--shiro-ink); }
.jrow button { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); }
.chip.plain, .tabs .tab { }
/* tappable rows & cards */
tr.click td:last-child::after { content: "›"; float: right; margin-left: 8px; color: var(--ai); font-size: 1.2rem; line-height: 1; }
@media (hover: hover) { tr.click:hover td { background: var(--ai-soft); } } tr.click:active td { background: var(--ai-soft); }
.ev-card { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.ev-card::after { content: "Open ›"; justify-self: end; font-size: .8rem; font-weight: 700; color: var(--ai); }
.bm.click { border-color: color-mix(in srgb, var(--ai) 35%, var(--line-2)); }
.bm.ready.click { border-color: var(--go); box-shadow: inset 4px 0 0 var(--go); }
.bm.ready.click .meta { background: var(--go-soft); color: var(--go); font-weight: 700; }
:root[data-theme="dark"] .bm.ready.click .meta { color: var(--go); }
table.kp tr.click td:first-child { box-shadow: inset 3px 0 0 var(--ai); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.back-btn { display: none; color: #fff; padding: 6px; min-height: 40px; border-radius: 10px; }
.bnav { display: none; }
.fab { display: none; }
/* More sheet */
.menu { display: grid; gap: 6px; }
.menu-item { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px; justify-content: stretch; text-align: left; min-height: 52px; border-radius: 12px; font-size: 1rem; background: var(--ai-soft); color: var(--ai); }
.menu-item.on { background: var(--ai); color: #fff; }
.menu-item .chev { font-size: 1.3rem; opacity: .7; }

/* ---------- phones & small tablets ---------- */
@media (max-width: 760px) {
  body { font-size: 17px; }
  .bar-in { padding: 8px 12px; gap: 8px; flex-wrap: nowrap; }
  .back-btn { display: inline-flex; }
  .brand .mark { display: none; }
  .brand { flex: 1 1 auto; min-width: 0; justify-content: flex-start; min-height: 40px; }
  .brand > span { min-width: 0; overflow: hidden; }
  .brand b { font-size: .95rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .spacer { display: none; }
  .bar-in > * { flex-shrink: 0; }
  .bar-in > .brand { flex-shrink: 1; }
  .bar .chip { padding: 3px 7px; font-size: .7rem; }
  .bar select { max-width: 132px; font-size: .78rem; min-height: 34px; padding: 4px 6px; }
  .tabs { display: none; }
  .bnav { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bnav[hidden] { display: none !important; }
  .bnav-in { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .bn { display: grid; justify-items: center; gap: 2px; padding: 7px 2px 6px; min-height: 56px; background: transparent; border: 0; border-radius: 0; color: var(--ink-3); font: 600 .68rem var(--f-body); }
  .bn[aria-selected="true"] { color: var(--ai); }
  .bn[aria-selected="true"] .ico { stroke-width: 2.3; }
  .bn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.has-bnav main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  main { padding: 14px 12px 90px; gap: 14px; }
  h1 { font-size: 1.2rem; }
  .section-h .label { font-size: .64rem; }
  .section-h > div > .small.muted { font-size: .78rem; }
  .fab { display: inline-flex; position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 31; align-items: center; gap: 8px; padding: 0 18px 0 14px; min-height: 52px; border-radius: 26px; background: var(--ai); color: #fff; border: 0; font: 700 .92rem var(--f-body); box-shadow: 0 6px 20px rgba(20,24,35,.28); }
  body:not(.has-bnav) .fab { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
  .fab .ico { stroke: #fff; }
  /* thumb-sized controls; 16px inputs stop iOS from zooming */
  button, .btn { min-height: 44px; border-radius: 12px; }
  button.sm { min-height: 38px; }
  input, select, textarea { font-size: 18px; min-height: 44px; border-radius: 10px; }
  input[type="checkbox"] { min-height: 0; width: 22px; height: 22px; }
  .section-h { align-items: stretch; }
  .section-h > div:first-child { min-width: 0; }
  main > * { min-width: 0; }
  .row.actions { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; min-width: 0; }
  .row.actions::-webkit-scrollbar { display: none; }
  .row.actions > button { flex: none; }
  .search { max-width: none; flex: 1; }
  .card { border-radius: 14px; }
  /* table → card list */
  table.mcards thead { display: none; }
  table.mcards, table.mcards tbody { display: block; }
  table.mcards tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: relative; }
  table.mcards td { display: block; padding: 0; border: 0; }
  table.mcards td:first-child { grid-column: 1 / -1; }
  table.mcards tr.click td:last-child::after { position: absolute; right: 12px; top: 14px; }
  table.mcards td.n { text-align: left; }
  table.mcards tr.click { padding-right: 30px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat b { font-size: 1.35rem; }
  /* scoresheet: full-screen sheet above the nav */
  .scrim { z-index: 60; }
  .sheet { max-height: 100%; border-radius: 16px 16px 0 0; }
  .sheet-h { padding: 12px 14px; }
  .sheet-b { padding: 12px 14px; }
  .sheet-f { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .sheet-f button { flex: 1 1 auto; }
  .bcol { min-width: 180px; width: 180px; }
  .queue .q { min-height: 48px; }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* ===== v1.4.1 dashboard buttons, ring ordering ===== */
.stat-btn { display: block; position: relative; text-align: left; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 30px 12px 14px; font-weight: 400; min-height: 0; cursor: pointer; }
.stat-btn:hover { border-color: var(--ai); background: var(--panel); }
.stat-btn .label { display: block; color: var(--ai); }
.stat-btn .stat-go { position: absolute; right: 12px; top: 12px; color: var(--ai); font-size: 1.3rem; line-height: 1; font-weight: 700; }
.stat-btn b { display: block; font: 600 1.6rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 4px; color: var(--ink); }
.stat-btn:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.rdivs { display: grid; gap: 6px; margin-top: 8px; }
.rdiv { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 8px 8px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: grab; touch-action: pan-y; }
.rdiv:focus-visible { outline: 2px solid var(--ai); outline-offset: 1px; }
.rdiv .grip { color: var(--ink-3); font-size: .9rem; letter-spacing: -2px; padding: 0 2px; }
.rdiv .rnum { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ai-soft); color: var(--ai); font-size: .74rem; font-weight: 700; }
.rdiv .rname { display: grid; min-width: 0; }
.rdiv .rname .name { white-space: normal; }
.rdiv .rmove { width: auto; max-width: 130px; min-height: 36px; font-size: .8rem; padding: 4px 6px; background: var(--ai-soft); color: var(--ai); border-color: transparent; font-weight: 600; }
.rdiv.pressing { background: var(--ai-soft); }
@media (prefers-reduced-motion: no-preference) { .rdiv.pressing { transition: background-color .45s ease; } }
.rdiv.dragging { border-color: var(--ai); box-shadow: 0 10px 24px rgba(20,24,35,.22); transform: scale(1.02); z-index: 2; position: relative; cursor: grabbing; background: var(--panel); }
.rdivs.sorting .rdiv:not(.dragging) { opacity: .75; }
@media (max-width: 760px) { .rdiv { min-height: 56px; } .rdiv .rmove { max-width: 110px; } }
.rdiv .rname .name { font-size: .9rem; line-height: 1.25; }
@media (max-width: 760px) { .rdiv { gap: 8px; } .rdiv .rmove { max-width: 92px; font-size: .76rem; } .rdiv .grip { display: none; } }

/* ===== v1.5: judges, officials, live match, segments, follow ===== */
.judge-card .jname { display: flex; flex-direction: column; align-items: flex-start; padding: 0; min-height: 0; text-align: left; min-width: 0; }
.judge-card .pill-list { justify-content: flex-end; }
.asg { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.asg select { width: auto; max-width: 140px; min-height: 36px; font-size: .8rem; }
.judge-pick { align-items: flex-start; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.judge-pick:last-child { border-bottom: 0; }
details.officials { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--panel); margin-bottom: 10px; }
details.officials > summary { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; list-style: none; min-height: 32px; }

.off-grid { display: grid; gap: 8px; margin-top: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); }
.off-grid select { min-height: 40px; }
.jrow .label .tiny, .srow .label .tiny, .kprow .jn { display: block; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 9em; margin: 0 auto; }
.live-card { border-left: 4px solid var(--aka); }
.live-log { margin: 6px 0 0; padding-left: 20px; font-size: .86rem; }
.live-log li:first-child { font-weight: 700; color: var(--aka); }
.seg-list { display: flex; flex-direction: column; }
.seg-row { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(130px, 1.3fr) 1.4fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.seg-row:first-child { border-top: 0; }
.seg-row select { min-height: 38px; }
@media (max-width: 640px) { .seg-row { grid-template-columns: 1fr auto; } .seg-row > select { grid-column: 1 / -1; } .seg-row > .pill-list { grid-column: 1 / 2; } }
.rdiv.guest { border-style: dashed; background: color-mix(in srgb, var(--ai-soft) 50%, var(--panel)); }
.rdiv[data-tap] { cursor: pointer; }
.star { min-height: 36px; min-width: 36px; padding: 0; border: 0; background: transparent; font-size: 1.3rem; color: var(--ink-3); line-height: 1; }
.star.on { color: #d4a017; }
.frow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.frow > span:nth-child(2) { flex: 1; min-width: 0; }
.fstat { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); cursor: pointer; margin-top: 6px; }
.fstat .chip { align-self: flex-start; white-space: normal; text-align: left; }
.fstat.compact { padding: 6px 8px; }
input.search { width: 100%; min-height: 44px; }
.section-h input.search { flex: 1 1 260px; max-width: 560px; }
.num, .mono, .stat b, td.n, .bm .ln .sc, .medal, .corner .big, .corner .tally, .clock, .now .sc, .kp-total, .srow input, .kprow input { font-feature-settings: "tnum" 1; }
.chip.ring-chip { background: var(--ai-soft); color: var(--ai); }
.chip.ring-chip::before { content: "◎ "; }
.jlist { display: flex; flex-direction: column; }
.jrow2 { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.jrow2:first-child { border-top: 0; }

.ring-sel { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; color: var(--ai); background: var(--ai-soft); border-radius: 999px; padding: 2px 4px 2px 10px; white-space: nowrap; }
.ring-sel select { width: auto; min-height: 32px; padding: 2px 26px 2px 8px; font-size: .82rem; font-weight: 600; border-radius: 999px; background-color: var(--panel); }
.card-h .ring-sel, .row.between > .ring-sel { margin-left: auto; }
@media (max-width: 640px) { .ring-sel select { min-height: 36px; font-size: 17px; } }
.share-link { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.share-link input { flex: 1 1 240px; min-width: 0; font-size: .85rem; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 10px; padding: 6px 12px; background: var(--ai-soft); color: var(--ai); font-weight: 600; }
.vlist { display: flex; flex-direction: column; }
.vrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.vrow:first-child { border-top: 0; }
.vrow .name { flex: 1 1 60%; min-width: 0; font-weight: 600; }
.vrow > .tiny { flex-basis: 100%; order: 2; }
.vrow > .pill-list { flex-basis: 100%; order: 3; }
.vrow.guest { background: color-mix(in srgb, var(--ai-soft) 45%, transparent); }
@media (hover: hover) { .vrow:hover { background: var(--paper); } }
a.btn.go { background: var(--go); color: var(--go-ink, #fff); }
ul.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.checks li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
ul.checks li:first-child { border-top: 0; }
ul.checks li > span:nth-child(2) { display: flex; flex-direction: column; min-width: 0; }

ul.checks li.ok .ck { background: var(--ok-soft); color: var(--ok); }
ul.checks li.no .ck { background: var(--bad-soft); color: var(--bad); }

.live-card2 { border-left: 4px solid var(--aka); }
.ready-box { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 12px; }
.ready-box.on { border-style: solid; border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: color-mix(in srgb, var(--ok-soft) 40%, transparent); }
.ready-box button { align-self: flex-start; }
.ready-box .ready-ring { font-size: 1.05em; }
.ready-checks { display: flex; flex-direction: column; gap: 0; }

button.chip.jin { cursor: pointer; min-height: 30px; }
.ev-card.locked { opacity: .82; cursor: default; }

details.admin-card > summary { cursor: pointer; list-style: none; }

/* ===== v1.9: tab bars with background colour (desktop, tablet, phone bottom bar) ===== */
.tabs { background: var(--ai-soft); border-bottom: 1px solid color-mix(in srgb, var(--ai) 25%, transparent); }

.tab, .tabs .tab { background: color-mix(in srgb, var(--panel) 70%, var(--ai-soft)); color: var(--ai); border: 1px solid color-mix(in srgb, var(--ai) 18%, transparent); border-radius: 999px; padding: 7px 14px; border-bottom-width: 1px; }
.tab:hover { background: var(--panel); }
.tab[aria-selected="true"], .tabs .tab[aria-selected="true"] { background: var(--ai); color: #fff; border-color: var(--ai); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { color: #0f1626; } }
:root[data-theme="dark"] .tab[aria-selected="true"] { color: #0f1626; }
@media (max-width: 760px) {
  .bnav { background: color-mix(in srgb, var(--ai-soft) 94%, transparent); border-top: 1px solid color-mix(in srgb, var(--ai) 25%, transparent); }

}
@media (max-width: 760px) and (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bn[aria-selected="true"] { color: #0f1626; } }
.demo-pick { text-align: left; align-items: flex-start; cursor: pointer; border: 1px solid var(--line); }
.demo-pick:hover { border-color: var(--ai); }

table.acc select { min-width: 150px; min-height: 36px; font-size: .85rem; }
.acc-chip { gap: 4px; padding-right: 4px; }
.acc-chip .x { min-height: 22px; min-width: 22px; padding: 0 4px; font-size: .75rem; color: var(--bad); }
/* judge rows: name + Move on the first line, credentials / check-in below (no overlap in narrow ring cards) */
.jrow2.jr { grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; }

.lock-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--ai-soft); color: var(--ink); margin-bottom: 12px; }
.archive-card { border-left: 4px solid var(--ok); }
details.archive-list { margin-top: 18px; }
details.archive-list > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 6px 0 10px; }

  .bar .logo svg { height: 22px; }
  .bar .logo-seal svg { height: 34px; }

function overviewHTML() {
  const ev = curEvent();

  const divs = DC.divs;
  let drawn = 0, fought = 0, playable = 0, complete = 0;
  const warn = [];
  for (const d of divs) {
    const bs = bracketState(d.id);
    if (bs.drawn) { drawn++; fought += bs.fought; playable += bs.playable; if (bs.complete) complete++; if (bs.changed && !bs.complete) warn.push(`<b>${esc(d.name)}</b>: entrants changed since the draw.`); }
  }

    if (inc) warn.push(`${plural(inc, 'registration')} missing required information. <button class="sm" data-act="tab" data-v="competitors" data-filter="incomplete">Review</button>`);

    const noJ = [...busy].filter(r => !ringJudges(r).length);
    if (Object.keys(S.d.judges).length && noJ.length) warn.push(`No judges on ${esc(noJ.map(ringName).join(', '))}. <button class="sm" data-act="tab" data-v="judges">Judges</button>`);
    const unJ = judgesList().filter(j => !S.d.rings[j.ringId]).length;
    if (unJ && busy.size) warn.push(`${plural(unJ, 'judge')} not assigned to a ring. <button class="sm" data-act="tab" data-v="judges">Judges</button>`);
    const need = KT.judgeNeed(ev.level, ev.judgeMin), low = judgesList().filter(j => S.d.rings[j.ringId] && (+j.kataLevel || 0) < need && (+j.kumiteLevel || 0) < need).length;

  const go = (tab, alt) => tabsFor().some(([k]) => k === tab) ? tab : alt;
  return eventHeader() + `<div class="stats">
      ${statBtn(go('competitors', 'competitors'), 'Competitors', `<b>${active.length}</b><div class="small muted">${checked} checked in</div><div class="meter"><i style="width:${active.length ? checked / active.length * 100 : 0}%"></i></div>`)}
      ${statBtn(go('divisions', 'brackets'), 'Divisions', `<b>${divs.length}</b><div class="small muted">${drawn} drawn · ${complete} finished</div>`)}

/** v1.52: where a competitor is from, led by what the event level separates by: country (International), region (National), dojo / club (otherwise). */

  const country = String(c.country || '').trim(), region = String(c.state || '').trim(), dojo = String(c.dojo || '').trim();
  const parts = level === 'International' ? [country, dojo && dojo.toLowerCase() !== ('team ' + country).toLowerCase() ? dojo : '']
    : level === 'National' ? [region, dojo] : [dojo, region];
  const [lead, ...rest] = parts.filter(Boolean);
  return lead ? `<b class="where">${esc(lead)}</b>${rest.length ? ' · ' + esc(rest.join(' · ')) : ''}` : '';
}
/** v1.53: the Competitors list order — this person's choice, else grouped (collapsible) by the event level's group. */

  const lv = (curEvent() || {}).level; return lv === 'International' ? 'country' : lv === 'National' ? 'region' : 'club';
}
function competitorsHTML() {

  const csGroup = c => cf ? String(c[cf] || '').trim() : '';
  const order = KT.sortEntrants(DC.comps.map(c => ({ id: c.id, last: c.lastName, first: c.firstName, group: csGroup(c) })), cs).map(x => x.id);
  const pos = Object.fromEntries(order.map((id, i) => [id, i]));

  const acts = dir ? `<button data-act="import-open">Import CSV</button><button data-act="export-comps">Export CSV</button>${DC.comps.length ? '<button class="danger" data-act="rm-group">Remove group…</button>' : ''}<button class="primary" data-act="comp-new">Add ${word}</button>` : '';

/** Division order: groups, age groups, kyu ranks. v1.46: each person's own choice (kept on their device); an order saved on the event by an older version is the starting point. */
function divOrder() { const o = S.ui.divOrder || (curEvent() || {}).divOrder || {}; return { groups: o.groups === 'finished' ? 'finished' : 'open', age: o.age === 'desc' ? 'desc' : 'asc', rank: o.rank === 'desc' ? 'desc' : 'asc' }; }
/** Division order: black-belt age groups, then kyu divisions by rank (each direction selectable); then event, gender. */
function divSortCmp(a, b) {
  const DO = divOrder(), sa = DO.age === 'desc' ? -1 : 1, sr = DO.rank === 'desc' ? -1 : 1;
  const kyu = d => d.belt === 'kyu' ? 1 : 0;
  const age = d => (d.minAge === '' || d.minAge == null ? 0 : +d.minAge);
  const rank = d => KT.rankValue(d.minRank) ?? -99;
  const evo = d => { const i = KT.EVENT_ORDER.indexOf(d.eventType); return i < 0 ? 99 : i; };
  const gen = d => ({ M: 0, W: 1, F: 1, X: 2 })[d.gender] ?? 3;
  return kyu(a) - kyu(b) || (kyu(a) ? sr * (rank(a) - rank(b)) || sa * (age(a) - age(b)) : sa * (age(a) - age(b))) || evo(a) - evo(b) || gen(a) - gen(b) || String(a.name).localeCompare(String(b.name));
}

/** v1.29: quota per country/region/dojo and team sizes for a division */
function divIssues(d) {

  for (const q of KT.quotaIssues(d, ents, id => entGroupLabel(id, lvl))) out.push({ kind: 'quota', group: q.group, text: `${q.group} ${q.n}/${q.max}`, long: `${q.group} has ${q.n} ${KT.EVENT_TYPES[d.eventType].team ? 'teams' : 'athletes'} — limit ${q.max}` });
  if (KT.EVENT_TYPES[d.eventType].team) { const sz = KT.teamSizeFor(d); for (const id of ents) { const t = DC.teamBy[id], n = t ? (t.memberIds || []).length : 0; if (t && (n < sz[0] || n > sz[1])) out.push({ kind: 'size', text: `${t.name}: ${n} members`, long: `${t.name} has ${n} members — this division needs ${sz[0] === sz[1] ? sz[0] : sz[0] + '–' + sz[1]}` }); } }

async function saveQuotaPick(f) {

}
function ageRange(d) {

/* ---------- mat / ring board ---------- */
function ringQueue(rid) {
  const out = [];
  // native divisions in running order, then pools/rounds/matches of other divisions placed on this ring
  const divs = DC.divs.filter(d => S.d.brackets[d.id]).sort((a, b) => ((a.ringId === rid ? 0 : 1) - (b.ringId === rid ? 0 : 1)) || (a.ringOrder || 0) - (b.ringOrder || 0));
  for (const d of divs) {
    const br = S.d.brackets[d.id];
    if (br.format === 'KP') { for (const p of KT.kpQueue(br)) if (KT.ringOf(d, p.seg) === rid) out.push({ did: d.id, kp: p }); continue; }
    for (const m of KT.readyMatches(br, DC.res[d.id])) if (KT.ringOf(d, KT.segOf(br, m), m.id) === rid) out.push({ did: d.id, m, r: DC.res[d.id][m.id] });
  }
  return out;
}
/** Tapping a kata competitor (on the mat / up next): scorers get that competitor's score card, everyone else the division's bracket. */
function kpTapAttrs(did, key) { return (canScoreKP(did, key) ? `data-act="kp-score" data-did="${esc(did)}" data-key="${esc(key)}"` : `data-act="view-bracket" data-id="${esc(did)}"`) + ' role="button" tabindex="0"'; }
/** v1.43: a competitor's previous kata and its average score, shown beside their name on the mat card and scoresheet. */
function prevKataHTML(p) {
  if (!p) return '';
  return `<div class="prev-kata"><span class="muted">${esc(p.label)}:</span> ${p.hansoku ? '<span class="chip bad">Han-soku</span>' : `<i>${esc(p.kata || '—')}</i> · <b class="num">${esc(p.avg)}</b>`}</div>`;
}
function kpPrevHTML(did, key) { const br = S.d.brackets[did], pv = br && br.format === 'KP' ? KT.kpPrevious(br, key) : null; return pv ? prevKataHTML(Object.assign({}, pv, { avg: pv.avg.toFixed(3) })) : ''; }
/** Head-to-head kata: the competitor's latest finished match in this division before this one (kata + score). */
function h2hPrevHTML(did, mid, id) {
  const dv = DC.divBy[did], br = S.d.brackets[did]; if (!id || !dv || !br || kindOf(dv) !== 'kata') return '';
  const res = DC.res[did] || {};
  const last = Object.keys(res).filter(k => k !== mid && res[k].status === 'done' && (res[k].a === id || res[k].b === id) && res[k].result)

/* ---------- kata score pools view ---------- */
function kpTableHTML(did, title, rows, order, opts) {
  const br = S.d.brackets[did], J = br.judges || 6, can = (rows[0] || order[0]) ? canScoreKP(did, (rows[0] || {}).key || '') : false, k = J >= 5 ? J - 2 : J;
  const f = x => (x / k).toFixed(3);
  const byId = Object.fromEntries(rows.map(r => [r.id, r]));
  const onMat = key => Object.values(S.d.ringstate).some(x => x && x.did === did && x.kp === key);
  const seq = opts.byRank ? rows : order.map(id => byId[id]);
  const sc = (r) => {
    const e = (br.scores || {})[r.key]; if (!e) return '';
    if (e.hansoku) return '<span class="chip bad">Han-soku</span>';
    const v = e.s.map(Number), hi = Math.max(...v), lo = Math.min(...v); let dh = J >= 5, dl = J >= 5;
    return v.map(x => { let cls = ''; if (dh && x === hi) { cls = 'dropped'; dh = false; } else if (dl && x === lo) { cls = 'dropped'; dl = false; } return `<span class="js ${cls}">${x.toFixed(1)}</span>`; }).join('');
  };
  return `<div class="card flush"><div class="card-h"><h3>${esc(title)}</h3>${opts.chip || ''}</div><div class="tw"><table class="kp"><thead><tr><th>#</th><th>${opts.byRank ? 'Place' : 'Order'}</th><th>Competitor · ${br.kataRule ? 'kata' : 'notes'}</th><th>Judges</th>${opts.carry ? '<th class="n">Semifinal</th><th class="n">Final</th>' : ''}<th class="n">Score</th></tr></thead><tbody>
    ${seq.map((r, i) => `<tr class="${can || isDirector() ? 'click' : ''} ${r.advance ? 'adv' : ''} ${onMat(r.key) ? 'live' : ''}" ${can || isDirector() ? `data-act="kp-score" data-did="${esc(did)}" data-key="${esc(r.key)}"` : ''}>
      <td class="num">${i + 1}</td><td class="num">${r.rank ? (opts.medals && r.rank <= 3 ? `<span class="medal ${['g', 's', 'b'][r.rank - 1]}">${r.rank}</span>` : r.rank) : '—'}${r.advance ? ' <span class="chip ok" title="Advances">▸</span>' : ''}</td>
      <td>${can || isDirector() ? `<button type="button" class="kp-who" aria-label="Score ${esc(entName(r.id, did))}"><span class="name">${esc(entName(r.id, did))}</span><span class="dojo">${esc(entDojo(r.id))}</span></button>` : `<div class="name">${esc(entName(r.id, did))}</div><div class="dojo">${esc(entDojo(r.id))}</div>`}
        ${r.kata || r.sheet ? `<div class="kp-line">${r.kata ? `<span class="kata-used">${esc(r.kata)}</span>` : ''}${r.sheet ? `<b class="kp-sc">${esc(f(r.own))}</b>` : ''}</div>` : ''}
        ${r.appTotal != null ? `<div class="tiny muted">Kata ${f(r.kataOwn)} · Application ${f(r.appTotal)}</div>` : ''}${r.rpTotal != null ? `<div class="tiny muted">Kettei-sen ${f(r.rpTotal)}</div>` : ''}</td>
      <td class="jcell">${sc(r)}</td>
      ${opts.carry ? `<td class="n">${r.sheet ? f(r.carry) : ''}</td><td class="n">${r.sheet ? f(r.own) : ''}</td>` : ''}
      <td class="n"><b>${r.sheet ? f(r.total) : ''}</b></td></tr>`).join('')}</tbody></table></div>
    ${opts.needRp && opts.needRp.length ? `<div class="notice warn" style="margin:10px 16px">Tied even after adding back all six scores: ${opts.needRp.map(id => esc(entName(id, did))).join(', ')} — Kettei-sen${br.kataRule ? ' with a different kata' : ''}.</div>` : ''}</div>`;
}
function kpViewHTML(did) {
  const br = S.d.brackets[did], st = KT.kpState(br);
  let h = `<p class="small muted">WTKF kata system · pools of up to ${br.poolSize || 8} · ${br.judges || 6} judges score 0–10${(br.judges || 6) >= 5 ? ', highest and lowest dropped, average of the rest' : ''} · top 4 of each pool advance until 8 remain · the final 8 is the semifinal (final elimination round); its top 4 perform in the final${br.kataRule ? ' with a different kata than in the semifinal (earlier rounds may repeat a kata)' : ''}${br.application ? ' · final adds Application (Bunkai)' : ''} · the semifinal score is carried forward: final placing = semifinal + final score · ties: all six scores added back, then Kettei-sen.</p>`;
  if (roundsRingLine(did)) h += `<div class="row" style="justify-content:flex-end;margin-bottom:8px">${roundsRingLine(did)}</div>`;
  // v1.43: the current round first, then the previous rounds from the most recent to the earliest
  const secs = [];
  for (const rd of st.rounds) {
    let h = `<div class="stage-h label">${esc(KT.kpRoundName(rd))}${rd === st.rounds[st.rounds.length - 1] && !st.final ? ' · current round' : ''}</div><div class="stack">`;
    for (const P of Object.keys(rd.pools)) {
      const p = rd.pools[P];
      const chip = (p.rows[0] ? segRingChip(did, KT.kpSegOfKey(br, p.rows[0].key)) : '') + (p.complete ? '<span class="chip ok">Complete</span>' : `<span class="chip plain">${p.rows.filter(r => r.sheet).length}/${p.rows.length} scored</span>`);
      h += kpTableHTML(did, `${Object.keys(rd.pools).length > 1 ? (br.wtkf ? (rd.n === 1 ? 'Chart ' : 'Group ') + (KT.POOL_NAMES.indexOf(P) + 1) : 'Pool ' + P) : br.wtkf && rd.type === 'semi' ? 'Final elimination' : KT.kpRoundName(rd)}`, p.rows, p.order, { byRank: p.scoredAll, chip, needRp: p.needRp });
    }
    h += '</div>';
    secs.push(h);
  }
  if (st.final) {
    const f = st.final;
    secs.push(`<div class="stage-h label">Final${f.complete ? '' : ' · current round'}</div>` + kpTableHTML(did, 'Final', f.rows, f.order, { byRank: f.rows.every(r => r.sheet), carry: f.carried, medals: f.complete,
      chip: segRingChip(did, 'F') + (f.complete ? '<span class="chip ok">Complete</span>' : `<span class="chip plain">${f.rows.filter(r => r.sheet).length}/${f.rows.length} scored</span>`), needRp: f.needRp }));
  }
  return h + secs.reverse().join('');
}

/** Fields of the event document that belong to that event's run, not to its setup. */
const DUP_DROP = ['id', 'live', 'liveAt', 'endedAt', 'locked', 'archived', 'approvedAt', 'approvedBy', 'reopenedAt', 'reopenedBy', 'public', 'shareToken'];
async function duplicateEvent(v) {
  const src = curEvent(), sid = S.evId; if (!src || !canCreateEvents()) return;
  if (!String(v.name || '').trim()) { toast('Give the copy a name.', true); return; }
  const id = uid(), now = new Date().toISOString(), keep = !!v.keepStatus;
  const ev = Object.assign({}, src, { name: String(v.name).trim(), startDate: v.startDate || src.startDate || '', endDate: v.endDate || '', createdAt: now, createdBy: S.myId || '', copiedFrom: sid,
    directorIds: [...new Set((src.directorIds || []).concat(S.myId ? [S.myId] : []))] });
  DUP_DROP.forEach(k => delete ev[k]);
  const D = clone(S.d), btn = $('#dup-go'); if (btn) { btn.disabled = true; btn.textContent = 'Duplicating…'; }
  toast('Duplicating…');
  if (!(await guard(() => S.store.set(P.event(id), ev)))) { if (btn) { btn.disabled = false; btn.textContent = 'Duplicate'; } return; }
  const fresh = (c, x) => keep ? x : c === 'competitors' ? Object.assign(x, { checkedIn: false, feePaid: false, waiver: false }) : c === 'judges' ? Object.assign(x, { checkedIn: false }) : x;
  let n = 0;
  for (const c of ['rings', 'divisions', 'competitors', 'teams', 'judges', 'sessions'])
    for (const [k, x] of Object.entries(D[c] || {})) { if (!(await guard(() => S.store.set(P.doc(id, c, k), fresh(c, x))))) return; n++; }
  for (const [k, x] of Object.entries(D.pv || {})) if (!(await guard(() => S.store.set(P.pv(id, k), x)))) return;
  if (v.brackets) for (const [k, x] of Object.entries(D.brackets || {})) if (!(await guard(() => S.store.set(P.live(id, 'brackets', k), x)))) return;
  closeModal(); openEvent(id);
  toast(`Copy created · ${plural(n, 'record')} copied`);
}

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;

/* ===== v1.11: approve results, lock and archive ===== */
/* When the tournament is complete the event director approves the results: the event is locked (read-only for

   An event director or app admin can reopen it if a correction is needed. */
function eventComplete() {
  const bs = DC.divs.filter(d => S.d.brackets[d.id]).map(d => bracketState(d.id));

  return { done: bs.length > 0 && bs.every(b => b.complete) && !undrawn, unfinished: bs.filter(b => !b.complete).length + undrawn };
}
function archiveCardHTML() {
  const ev = curEvent(); if (!ev || isPublicView() || ev.locked || !isEventDirector(ev)) return '';
  if (ev.kind === 'tournament' && ev.live) return '';

  const started = Object.keys(S.d.brackets).length > 0 || ev.kind !== 'tournament';
  if (!started && !ev.endedAt) return '';
  return `<div class="card stack archive-card"><div class="row between"><h3>${c.done ? 'Tournament complete' : 'Finish the event'}</h3>${c.done ? '<span class="chip ok">All divisions finished</span>' : `<span class="chip warn">${plural(c.unfinished, 'division')} not finished</span>`}</div>

    <div class="row"><button class="${c.done ? 'go' : ''}" data-act="ev-archive">Approve results &amp; archive</button><button class="sm" data-act="tab" data-v="results">Review results</button></div></div>`;

async function archiveEvent() {

    : `${plural(c.unfinished, 'division')} still unfinished. Approve the results anyway? The event becomes read-only and moves to the archive.`;

function wtkfChartsFor(dv) {

const drawDiv = dv => Object.assign({}, dv, { wtkfCharts: wtkfChartsFor(dv) });
async function drawDivision(did) {
  const dv = DC.divBy[did]; if (!dv) return;

  const ents = divEntrants(did);
  if (!ents.length) { toast('No entrants in this division.', true); return; }
  if (bs.drawn && !(await confirmBox(`Redraw ${dv.name}? The current draw is replaced.`, 'Redraw'))) return;
  const clash = KT.seedClashes(dv.seeds);
  if (Object.keys(clash).length) { toast(seedClashText(clash) + ' Fix the seeds in Settings first.', true); return; }
  const over = divIssues(dv).filter(i => i.kind === 'quota');   // v1.30: no draw while a country is over the limit
  if (over.length) { toast(`${dv.name} can't be drawn yet: ${over.map(i => i.long).join('; ')}. Choose who competes first.`, true); if (isDirector()) quotaPickForm(did, over[0].group); return; }
  const list = ents.map(id => ({ id, seed: (dv.seeds || {})[id] || 0, group: entGroup(id) }));
  const br = KT.generateBracket(drawDiv(dv), list);

  if (ok) { S.ui.bracketDiv = did; }
}
async function drawAll() {
  const cand = DC.divs.filter(d => !S.d.brackets[d.id] && divEntrants(d.id).length >= 1);
  const blocked = cand.filter(d => divIssues(d).some(i => i.kind === 'quota')), ready = cand.filter(d => !blocked.includes(d));
  const bTxt = blocked.length ? `${plural(blocked.length, 'division')} over quota ${blocked.length === 1 ? 'is' : 'are'} not drawn: ${blocked.map(d => d.name + ' (' + divIssues(d).filter(i => i.kind === 'quota').map(i => i.text).join(', ') + ')').join('; ')}.` : '';
  if (!ready.length) { toast(blocked.length ? bTxt + ' Choose who competes first.' : 'Every division with entrants is already drawn.', !!blocked.length); return; }
  if (!(await confirmBox(`Draw ${plural(ready.length, 'division')} now?${bTxt ? '\n\n' + bTxt + ' Use “Over quota · Choose” on those divisions first.' : ''}`, 'Draw'))) return;
  for (const d of ready) {

    if (Object.keys(clash).length) { toast(`${d.name}: ` + seedClashText(clash), true); return; }
    const list = divEntrants(d.id).map(id => ({ id, seed: (d.seeds || {})[id] || 0, group: entGroup(id) }));
    if (!(await guard(() => S.store.set(P.live(S.evId, 'brackets', d.id), KT.generateBracket(drawDiv(d), list))))) return;

}
async function deleteEvent(id) {

  'k-ev': el => {
    const M = S.modal, d = loadDraft(M.key), dv = DC.divBy[M.did], sc = scoringOf(dv);
    const log = logAt(d, el.dataset.p);
    if (CLOCK.running && el.dataset.t !== 'hansoku' && el.dataset.t !== 'kiken') { toast('Stop the clock (Yame) first.', true); return; }
    const ev = { t: el.dataset.t }; if (el.dataset.s) ev.s = el.dataset.s;
    // Shobu Ippon Ten-to: penalty match while time remains; 1 point only when time has expired
    if (ev.t === 'tento' && !(kumiteStyle(dv) !== 'shobu' && el.dataset.p !== 'daihyo') && clockLeft() > 0) { ev.exec = true; toast(`Ten-to · ${ev.s === 'a' ? 'Aka' : 'Shiro'} Sagaru — penalty match (Tsuzukete, hajime)`); }
    const o = { kettei: sc.ketteiTime > 0, allowDraw: el.dataset.p.startsWith('bouts'), ketteiOnly: el.dataset.p === 'daihyo' };
    const kc = kindOf(dv) === 'kumite' ? kyuCfg(dv) : null;
    const E = kc ? (l => KT.kyuEval(l, kc)) : kumiteStyle(dv) === 'kogo' && el.dataset.p !== 'daihyo' ? KT.kogoEval : KT.kumiteEval;
    // Ko-go: every exchange is a stand-alone match — a score or penalty ends it (the next exchange starts automatically)
    if (E === KT.kogoEval && ev.s && !['hansoku', 'kiken', 'hantei'].includes(ev.t)) ev.ae = 1;
    const before = E(log, o).phase;
    log.push(ev);
    const after = E(log, o);
    if (E === KT.kumiteEval && before !== 'kettei' && after.phase === 'kettei') setClock(sc.ketteiTime);
    if (after.done) stopClock();
    draftChanged();
  },

/* ---------- touch-and-hold drag to reorder divisions within a ring ---------- */
const HOLD_MS = 450;
function wireRingDrag() {
  let hold = null, drag = null;
  const cancelHold = () => { if (hold) { clearTimeout(hold.t); hold = null; } };
  const blockScroll = e => { if (drag) e.preventDefault(); };
  document.addEventListener('pointerdown', e => {
    const row = e.target.closest('.rdiv'); if (!row || e.target.closest('select') || !isDirector()) return;
    if (e.button != null && e.button !== 0) return;
    cancelHold();
    hold = { row, x: e.clientX, y: e.clientY, id: e.pointerId, t: setTimeout(() => startDrag(row, e.clientY), HOLD_MS) };
    row.classList.add('pressing');
  });
  function startDrag(row, y) {
    hold = null; row.classList.remove('pressing');
    const list = row.parentElement;
    drag = { row, list, startOrder: [...list.children].map(x => x.dataset.id), lastY: y };
    S.dragging = true;
    row.classList.add('dragging'); list.classList.add('sorting');
    document.addEventListener('touchmove', blockScroll, { passive: false });
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) { /* ignore */ }
  }
  document.addEventListener('pointermove', e => {
    if (hold && (Math.abs(e.clientX - hold.x) > 8 || Math.abs(e.clientY - hold.y) > 8)) { hold.row.classList.remove('pressing'); cancelHold(); return; }
    if (!drag) return;
    e.preventDefault();
    const rows = [...drag.list.children].filter(x => x !== drag.row);
    let before = null;
    for (const r of rows) { const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { before = r; break; } }
    if (before !== drag.row.nextElementSibling) drag.list.insertBefore(drag.row, before);
    [...drag.list.children].forEach((r, i) => { const n = r.querySelector('.rnum'); if (n) n.textContent = i + 1; });
  }, { passive: false });
  const end = async () => {
    if (hold) { hold.row.classList.remove('pressing'); cancelHold(); }
    if (!drag) return;
    const { row, list, startOrder } = drag; drag = null; S.justDragged = Date.now();
    document.removeEventListener('touchmove', blockScroll);
    row.classList.remove('dragging'); list.classList.remove('sorting');
    const order = [...list.children].map(x => x.dataset.id);
    S.dragging = false;
    if (order.join('|') !== startOrder.join('|')) await saveRingOrder(order);
    if (S.renderPending) { S.renderPending = false; } render();
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  document.addEventListener('contextmenu', e => { if (e.target.closest('.rdiv')) e.preventDefault(); });
  // keyboard: Alt+↑ / Alt+↓ moves the focused division
  document.addEventListener('keydown', async e => {
    const row = e.target.closest && e.target.closest('.rdiv'); if (!row || !e.altKey || !isDirector()) return;
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    const list = row.parentElement, ids = [...list.children].map(x => x.dataset.id), i = ids.indexOf(row.dataset.id), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await saveRingOrder(ids);
    setTimeout(() => { const el = document.querySelector(`.rdiv[data-id="${row.dataset.id}"]`); if (el) el.focus(); }, 60);
  });
}
async function saveRingOrder(ids) {
  let changed = 0;
  for (let k = 0; k < ids.length; k++) {
    const d = DC.divBy[ids[k]]; if (!d || (d.ringOrder || 0) === k) continue;
    changed++; await guard(() => S.store.update(P.doc(S.evId, 'divisions', d.id), { ringOrder: k }));

}

  // v1.39.1: the hosted (Vercel) build must never fall back to an empty local store because its Firebase config is missing or still the example.
  if (window.firebase && fbConfigBad(window.KT_FIREBASE_CONFIG) && hostedSite()) { FB.needSignIn = true; FB.cfgMissing = true; S.store = { mode: 'firebase' }; render(); return; }
  if (window.KT_FIREBASE_CONFIG && window.firebase) {
    try { if (!(await initFirebase(window.KT_FIREBASE_CONFIG))) return; }
    catch (e) { console.error(e); S.store = LocalStore(); toast('Could not reach Firebase. Working in local mode.', true); }

  }

  if (cl) {

  }
  if (db) {
    S.store = CloudStore(db); S.user = user;
    if (user) {
      try {
        const [me, canEd, canW, own] = await Promise.all([user.me(), user.canEdit(), user.can('data.write'), user.isOwner()]);
        // v1.7: director = the page's owner + people the owner makes directors; other editors are ring managers once assigned
        S.myId = me.id; S.isOwnerFlag = !!own; S.canEditor = !!canEd; S.isAdmin = !!own; S.isOrganizer = !!own; S.canWrite = canW; S.myEmail = String(me.email || '').toLowerCase(); S.myName = me.name || '';
        if (canW === false && !canEd) S.readOnly = true;
      } catch (e) { /* reads never reject */ }
    }
  } else {
    S.store = LocalStore();
  }
  if (S.pub) { S.readOnly = true; startPublic(); } else subscribeEvents();
  render();
}
init();
})();
